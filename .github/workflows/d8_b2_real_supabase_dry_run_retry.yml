name: d8_b2_real_supabase_dry_run_retry

on:
  workflow_dispatch:

jobs:
  run-dry-run-retry:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate required secrets are present
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Secret-safe environment presence check
        run: |
          python - <<'PY'
          import os
          for k in ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_ANON_KEY", "SUPABASE_KEY"]:
              v = os.getenv(k)
              print(k, "present=", bool(v), "length=", len(v) if v else 0)
          PY

      - name: Execute D8.B2 dry-run retry
        run: |
          PYTHONPATH=. python scripts/run_d8_b2_real_supabase_dry_run_retry.py
      - name: Validate no-write marker
        run: |
          if ! grep -E -n "explicit_no_write_confirmation: `true`|no_write_confirmed: `true`" reports/d8_b2_real_supabase_dry_run_retry_report.md; then
            echo "No-write marker missing"
            exit 1
          fi
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-b2-real-supabase-dry-run-retry-report
          path: reports/d8_b2_real_supabase_dry_run_retry_report.md
