name: Phase 5D Structural Propagation Regime Forecasting

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Historical dynamics lookback window
        required: false
        default: "180"
      forecast_horizon_days:
        description: Deterministic forecast horizon
        required: false
        default: "30"
  schedule:
    - cron: "40 1 * * *"

jobs:
  phase5d-regime-forecasting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      THEME_NAME: ai
      GITHUB_RUN_ID: ${{ github.run_id }}
      EXECUTION_CONTEXT_FILE: logs/execution_context.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure logs directory exists
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs

      - name: Tier 3C resolve shared execution context
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file "${EXECUTION_CONTEXT_FILE}"

      - name: Run Phase 5D structural propagation regime forecasting engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '180' }}
          FORECAST_HORIZON_DAYS: ${{ github.event.inputs.forecast_horizon_days || '30' }}
        run: |
          python transmission_layers/graph_foundation/phase5d_structural_propagation_regime_forecasting_engine.py

      - name: Tier 3D generate validation summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source phase5d_structural_propagation_regime_forecasting_engine \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "SUCCESS" \
            --runtime-seconds "0" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Upload Phase 5D execution logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-structural-propagation-regime-forecasting-execution-logs
          if-no-files-found: warn
          path: |
            logs/platform_pipeline_index.json
            logs/platform_runtime_summary.json
            logs/platform_validation_summary.json
            logs/platform_operational_summary.json
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
