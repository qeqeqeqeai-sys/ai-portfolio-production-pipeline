name: Controlled D1 Dashboard Sample-Data Seeding

on:
  workflow_dispatch:

jobs:
  run-d1-dashboard-seed:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Safety gate
        run: echo "Executing deterministic controlled sample-data seed"

      - name: Validate required Supabase secrets
        run: |
          missing=0
          if [ -z "${SUPABASE_URL}" ]; then
            echo "SUPABASE_URL: missing"
            missing=1
          else
            echo "SUPABASE_URL: present"
          fi

          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_ANON_KEY: missing"
            missing=1
          else
            echo "SUPABASE_ANON_KEY: present"
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Missing required Supabase repository secrets."
            exit 1
          fi

      - name: Execute deterministic D1 dashboard sample seed
        run: python scripts/run_d1_dashboard_sample_seed.py --execute
