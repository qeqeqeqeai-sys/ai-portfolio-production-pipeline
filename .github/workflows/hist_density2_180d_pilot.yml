name: HIST-DENSITY-2 180D Pilot

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Optional ISO date"
        required: false
        type: string
      raw_cache_enabled:
        description: "Enable raw FMP cache reads"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      raw_cache_write_enabled:
        description: "Enable raw FMP cache writes"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  hist-density-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run HIST-DENSITY-2 pilot
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date }}
          INPUT_RAW_CACHE_ENABLED: ${{ github.event.inputs.raw_cache_enabled }}
          INPUT_RAW_CACHE_WRITE_ENABLED: ${{ github.event.inputs.raw_cache_write_enabled }}
        run: |
          PYTHONPATH=. python scripts/run_hist_density_2_180d_pilot.py --density-mode real_ops_hist1 --trading-days 180 --symbol-count 50 --output-root reports/hist_density2_pilot_180d ${INPUT_END_DATE:+--end-date "$INPUT_END_DATE"} ${INPUT_RAW_CACHE_ENABLED:+$( [ "$INPUT_RAW_CACHE_ENABLED" = "true" ] && echo --raw-cache-enabled )} ${INPUT_RAW_CACHE_WRITE_ENABLED:+$( [ "$INPUT_RAW_CACHE_WRITE_ENABLED" = "true" ] && echo --raw-cache-write-enabled )}
          
