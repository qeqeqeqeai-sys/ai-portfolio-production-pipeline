name: Phase 5C - Regime-Aware Corridor Dynamics

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Historical corridor lookback days"
        required: false
        default: "180"
      min_current_score:
        description: "Minimum current corridor intelligence score to evaluate"
        required: false
        default: "0.0"
      transition_delta_threshold:
        description: "Score delta threshold for regime transition flags"
        required: false
        default: "0.08"
      dormancy_gap_days:
        description: "Days since previous observation before dormancy/reactivation logic applies"
        required: false
        default: "7"
  schedule:
    - cron: "45 23 * * *" # 07:45 Singapore time, after Phase 5B

jobs:
  phase5c-regime-corridor-dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THEME_NAME: ai
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '180' }}
      MIN_CURRENT_SCORE: ${{ github.event.inputs.min_current_score || '0.0' }}
      TRANSITION_DELTA_THRESHOLD: ${{ github.event.inputs.transition_delta_threshold || '0.08' }}
      DORMANCY_GAP_DAYS: ${{ github.event.inputs.dormancy_gap_days || '7' }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      EXECUTION_CONTEXT_FILE: logs/execution_context.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure logs directory exists
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs

      - name: Tier 3C resolve shared execution context
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file "${EXECUTION_CONTEXT_FILE}"

      - name: Run Phase 5C regime-aware corridor dynamics engine
        run: |
          python transmission_layers/graph_foundation/phase5c_regime_corridor_dynamics_engine.py

      - name: Tier 3D generate validation summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source phase5c_regime_corridor_engine \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "SUCCESS" \
            --runtime-seconds "0" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Upload Phase 5C execution logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-regime-corridor-execution-logs
          path: |
            logs/platform_pipeline_index.json
            logs/platform_runtime_summary.json
            logs/platform_validation_summary.json
            logs/platform_operational_summary.json
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
