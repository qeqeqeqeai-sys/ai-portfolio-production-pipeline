name: Phase 5C - Regime-Aware Corridor Dynamics

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Historical corridor lookback days"
        required: false
        default: "180"
      min_current_score:
        description: "Minimum current corridor intelligence score to evaluate"
        required: false
        default: "0.0"
      transition_delta_threshold:
        description: "Score delta threshold for regime transition flags"
        required: false
        default: "0.08"
      dormancy_gap_days:
        description: "Days since previous observation before dormancy/reactivation logic applies"
        required: false
        default: "7"
  schedule:
    - cron: "45 23 * * *" # 07:45 Singapore time, after Phase 5B

jobs:
  phase5c-regime-corridor-dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '180' }}
      MIN_CURRENT_SCORE: ${{ github.event.inputs.min_current_score || '0.0' }}
      TRANSITION_DELTA_THRESHOLD: ${{ github.event.inputs.transition_delta_threshold || '0.08' }}
      DORMANCY_GAP_DAYS: ${{ github.event.inputs.dormancy_gap_days || '7' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Phase 5C regime-aware corridor dynamics engine
        run: |
          python transmission_layers/graph_foundation/phase5c_regime_corridor_dynamics_engine.py
