name: Phase 1 - AI Transmission Dual Write

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 7:30 AM Singapore time
    # GitHub Actions uses UTC, so 23:30 UTC = 07:30 SGT next day
    - cron: "30 23 * * *"

jobs:
  ai-transmission-dual-write:
    name: Run AI Transmission Dual Write
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONUNBUFFERED: "1"

      OBS_LOOKBACK_DAYS: "14"
      PRICE_LOOKBACK_DAYS: "30"
      MAX_TRANSMISSION_MAP_ROWS: "500"

      THEME_NAME: "ai"
      THEME_VERSION: "v1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "FMP_API_KEY",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              raise SystemExit(f"Missing required GitHub Secrets: {missing}")

          print("All required secrets are present.")
          PY

      # ------------------------------------------------------------------
      # Tier 3B — Advisory-only orchestration preflight
      # ------------------------------------------------------------------
      - name: Tier 3B preflight orchestration guardrails
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDRAILS_STRICT_MODE: "false"
          GUARDRAILS_EXPECTED_WORKFLOW_ROLE: "phase1_ai_transmission_dual_write"
        run: |
          python -m core.orchestration_guardrails.cli preflight \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}"

      - name: Run AI transmission scoring dual-write
        run: |
          python ai_transmission/ai_transmission_scoring_v2_phase1_refactor_built.py

      - name: Upload logs / outputs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-ai-transmission-dual-write-artifacts
          path: |
            outputs/
            logs/
          if-no-files-found: ignore
