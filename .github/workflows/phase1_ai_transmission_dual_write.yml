name: Phase 1 - AI Transmission Dual Write

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 7:30 AM Singapore time
    # GitHub Actions uses UTC, so 23:30 UTC = 07:30 SGT next day
    - cron: "30 23 * * *"

jobs:
  ai-transmission-dual-write:
    name: Run AI Transmission Dual Write
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      OBS_LOOKBACK_DAYS: "14"
      PRICE_LOOKBACK_DAYS: "30"
      MAX_TRANSMISSION_MAP_ROWS: "500"

      THEME_NAME: "ai"
      THEME_VERSION: "v1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI transmission scoring dual-write
        run: |         
          python ai_transmission/ai_transmission_scoring_v2_phase1_refactor_built.py

      - name: Upload logs / outputs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-ai-transmission-dual-write-artifacts
          path: |
            outputs/
            logs/
          if-no-files-found: ignore
