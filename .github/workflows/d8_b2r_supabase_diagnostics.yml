name: D8.B2-R Real Supabase Diagnostics (Read-Only)

on:
  workflow_dispatch:

jobs:
  d8-b2r-diagnostics:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets are present
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Run read-only Supabase diagnostics
        run: |
          echo "Running D8.B2-R diagnostics in read-only mode only (no write/backfill execution)."
          PYTHONPATH=. python scripts/run_d8_b2r_real_supabase_diagnostics.py

      - name: Confirm read-only diagnostics only
        run: |
          if ! rg -n "Mode:\*\* READ-ONLY diagnostics|Explicit no-write confirmation:\*\* true" reports/d8_b2r_real_supabase_diagnostics_status_report.md; then
            echo "Read-only confirmation markers missing from diagnostics report."
            exit 1
          fi
          echo "Read-only diagnostics confirmed."

      - name: Upload diagnostics report artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-b2r-real-supabase-diagnostics-report
          path: reports/d8_b2r_real_supabase_diagnostics_status_report.md
          if-no-files-found: error
