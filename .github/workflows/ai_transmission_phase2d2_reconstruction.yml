name: AI Transmission Phase 2D.2 Reconstruction

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: "Theme name to reconstruct"
        required: false
        default: "ai"

      lookback_days:
        description: "Historical lookback window"
        required: false
        default: "365"

      chunk_days:
        description: "Chunk size in days"
        required: false
        default: "30"

      rolling_window:
        description: "Rolling analytics window"
        required: false
        default: "30"

jobs:
  reconstruct:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"

      # ============================================================
      # SUPABASE
      # ============================================================

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ============================================================
      # RECONSTRUCTION SETTINGS
      # ============================================================

      THEME_NAME: ${{ github.event.inputs.theme_name }}
      RECONSTRUCTION_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
      RECONSTRUCTION_CHUNK_DAYS: ${{ github.event.inputs.chunk_days }}
      RECONSTRUCTION_ROLLING_WINDOW: ${{ github.event.inputs.rolling_window }}

      RECONSTRUCTION_BATCH_SIZE: "500"
      RECONSTRUCTION_SLEEP_SECONDS: "0.15"

      # Keep enough history for rolling momentum + acceleration calculations
      RECONSTRUCTION_HISTORY_BUFFER_DAYS: "65"

      # ============================================================
      # PASS 1 — PAGINATION INFRASTRUCTURE
      # ============================================================

      PAGINATION_PAGE_SIZE: "1000"
      PAGINATION_THROTTLE_SECONDS: "0.10"
      PAGINATION_MAX_RETRIES: "5"
      PAGINATION_RETRY_BACKOFF_SECONDS: "2.0"
      PAGINATION_ENABLE_VALIDATION: "true"
      PAGINATION_ENABLE_TELEMETRY: "true"

      # ============================================================
      # PASS 2 — STREAMING OBSERVATION LOADER
      # ============================================================

      STREAMING_LOADER_ENABLE_NORMALIZATION_TELEMETRY: "true"
      STREAMING_LOADER_ENABLE_VALIDATION: "true"

      # ============================================================
      # PASS 3 — ROLLING AGGREGATION INFRASTRUCTURE
      # ============================================================

      ROLLING_AGGREGATION_STABILITY_WINDOW: "30"

      ROLLING_AGGREGATION_ENABLE_TELEMETRY: "true"

      ROLLING_AGGREGATION_MOMENTUM_SHORT_LAG: "7"
      ROLLING_AGGREGATION_MOMENTUM_LONG_LAG: "30"

      ROLLING_AGGREGATION_EVIDENCE_SHORT_WINDOW: "7"
      ROLLING_AGGREGATION_EVIDENCE_LONG_WINDOW: "30"

      ROLLING_AGGREGATION_MOMENTUM_BASE_SCORE: "50"

      ROLLING_AGGREGATION_MOMENTUM_SHORT_WEIGHT: "3.0"
      ROLLING_AGGREGATION_MOMENTUM_LONG_WEIGHT: "1.5"

      ROLLING_AGGREGATION_ACCELERATION_SHORT_WEIGHT: "2.0"

      ROLLING_AGGREGATION_MAX_PERSISTENCE_BONUS: "30"
      EXECUTION_CONTEXT_FILE: logs/execution_context.json

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            pandas \
            numpy \
            python-dateutil \
            pytz

      - name: Create runtime folders
        run: |
          mkdir -p logs outputs

      - name: Capture pipeline start timestamp
        shell: bash
        run: |
          echo "PIPELINE_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      # ============================================================
      # TIER 3C — SHARED EXECUTION CONTEXT
      # ============================================================

      - name: Tier 3C resolve shared execution context
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --requested-run-date-sgt "" \
            --output-file "${EXECUTION_CONTEXT_FILE}"

      - name: Tier 3C export execution context to GitHub env
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context export-github-env \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --github-env-file "${GITHUB_ENV}"

      # ============================================================
      # VALIDATE FILES
      # ============================================================

      - name: Validate reconstruction files
        run: |
          test -f transmission_layers/ai_transmission/phase2d2_historical_reconstruction_engine_schema_aligned_revised.py

          test -f utils/paginated_rest_loader.py
          test -f utils/streaming_observation_loader.py
          test -f utils/rolling_reconstruction_aggregators.py

          echo "All reconstruction files found."

      # ============================================================
      # PYTHON COMPILE VALIDATION
      # ============================================================

      - name: Python compile validation
        run: |
          python -m py_compile \
            transmission_layers/ai_transmission/phase2d2_historical_reconstruction_engine_schema_aligned_revised.py

          python -m py_compile utils/paginated_rest_loader.py
          python -m py_compile utils/streaming_observation_loader.py
          python -m py_compile utils/rolling_reconstruction_aggregators.py

          echo "Python compile validation passed."

      # ============================================================
      # RUN RECONSTRUCTION
      # ============================================================

      - name: Run Phase 2D.2 historical reconstruction
        run: |
          python transmission_layers/ai_transmission/phase2d2_historical_reconstruction_engine_schema_aligned_revised.py

      - name: Mark reconstruction pipeline status success
        shell: bash
        run: |
          echo "PIPELINE_STATUS=SUCCESS" >> "$GITHUB_ENV"

      - name: Capture reconstruction runtime seconds
        shell: bash
        run: |
          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))
          echo "PIPELINE_RUNTIME_SECONDS=${PIPELINE_RUNTIME_SECONDS}" >> "$GITHUB_ENV"
          echo "Phase 2D.2 runtime seconds: ${PIPELINE_RUNTIME_SECONDS}"

      # ============================================================
      # TIER 3D — CONTEXT-AWARE VALIDATION, TELEMETRY, ARTIFACT MANIFEST
      # ============================================================

      - name: Tier 3D generate validation summary
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source phase2d2_historical_reconstruction \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "${PIPELINE_STATUS:-SUCCESS}" \
            --runtime-seconds "${PIPELINE_RUNTIME_SECONDS:-0}" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p logs
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Tier 3F operational trend intelligence
        if: always()
        continue-on-error: true
        shell: bash
        run: python -m core.orchestration_guardrails.cli trend analyze

      # ============================================================
      # WORKFLOW SUMMARY
      # ============================================================

      - name: Reconstruction summary
        if: always()
        run: |
          echo "=========================================="
          echo "Phase 2D.2 Reconstruction Completed"
          echo "=========================================="

          echo "Theme Name: ${THEME_NAME}"
          echo "Lookback Days: ${RECONSTRUCTION_LOOKBACK_DAYS}"
          echo "Chunk Days: ${RECONSTRUCTION_CHUNK_DAYS}"
          echo "Rolling Window: ${RECONSTRUCTION_ROLLING_WINDOW}"

          echo "------------------------------------------"

          echo "Pagination Page Size: ${PAGINATION_PAGE_SIZE}"
          echo "Pagination Validation: ${PAGINATION_ENABLE_VALIDATION}"

          echo "------------------------------------------"

          echo "Rolling Stability Window: ${ROLLING_AGGREGATION_STABILITY_WINDOW}"

          echo "=========================================="

      - name: Upload Phase 2D.2 execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d2-historical-reconstruction-artifacts
          path: |
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
            logs/platform_pipeline_index.json
            logs/platform_runtime_summary.json
            logs/platform_validation_summary.json
            logs/platform_operational_summary.json
            logs/platform_execution_consistency.json
            logs/platform_operational_trend_summary.json
            logs/platform_recurring_warnings.json
            logs/platform_runtime_drift_summary.json
            logs/platform_workflow_health_score.json
          if-no-files-found: ignore
