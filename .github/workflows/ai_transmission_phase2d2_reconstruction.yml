name: AI Transmission Phase 2D.2 Historical Reconstruction

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: "Theme name to reconstruct"
        required: false
        default: "ai"
      lookback_days:
        description: "Historical lookback days"
        required: false
        default: "365"
      chunk_days:
        description: "Chunk size in days"
        required: false
        default: "30"
      rolling_window:
        description: "Rolling reconstruction window"
        required: false
        default: "20"

jobs:
  phase2d2-historical-reconstruction:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      THEME_NAME: ${{ github.event.inputs.theme_name }}
      RECONSTRUCTION_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
      RECONSTRUCTION_CHUNK_DAYS: ${{ github.event.inputs.chunk_days }}
      RECONSTRUCTION_ROLLING_WINDOW: ${{ github.event.inputs.rolling_window }}
      RECONSTRUCTION_BATCH_SIZE: "500"
      MIN_RECONSTRUCTED_DAYS: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Phase 2D.2 Historical Reconstruction Engine
        run: |
          python transmission_layers/ai_transmission/phase2d2_historical_reconstruction_engine_schema_aligned.py

      - name: Run Phase 2D.2 Reconstruction Validation Gates
        run: |
          python transmission_layers/ai_transmission/phase2d2_reconstruction_validation_gates_schema_aligned.py
