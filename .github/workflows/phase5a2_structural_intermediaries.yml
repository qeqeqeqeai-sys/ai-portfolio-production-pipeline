name: Phase 5A.2 Structural Intermediary Formation

on:
  workflow_dispatch:
    inputs:
      min_inbound:
        description: Minimum inbound edges required
        required: false
        default: '1'
      min_outbound:
        description: Minimum outbound edges required
        required: false
        default: '1'
      edge_tables:
        description: Comma-separated edge tables to scan
        required: false
        default: 'structural_theme_graph_edges,structural_theme_graph_continuity_edges,structural_theme_graph_two_hop_edges,structural_theme_graph_transmission_edges'
  schedule:
    - cron: '25 23 * * *'

jobs:
  phase5a2-structural-intermediaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      INTERMEDIARY_MIN_INBOUND: ${{ github.event.inputs.min_inbound || '1' }}
      INTERMEDIARY_MIN_OUTBOUND: ${{ github.event.inputs.min_outbound || '1' }}
      INTERMEDIARY_EDGE_TABLES: ${{ github.event.inputs.edge_tables || 'structural_theme_graph_edges,structural_theme_graph_continuity_edges,structural_theme_graph_two_hop_edges,structural_theme_graph_transmission_edges' }}
      INTERMEDIARY_LIMIT_PER_TABLE: '5000'
      PYTHONPATH: ${{ github.workspace }}
      THEME_NAME: ai
      EXECUTION_CONTEXT_FILE: logs/execution_context.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run structural intermediary formation engine
        working-directory: transmission_layers/graph_foundation/intermediaries
        run: |
          python intermediary_detection_engine.py \
            --run-id "${GITHUB_RUN_ID}" \
            --min-inbound "${INTERMEDIARY_MIN_INBOUND}" \
            --min-outbound "${INTERMEDIARY_MIN_OUTBOUND}" \
            --edge-tables "${INTERMEDIARY_EDGE_TABLES}"

      - name: Ensure logs directory exists
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs

      - name: Tier 3C resolve shared execution context
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file "${EXECUTION_CONTEXT_FILE}"

      - name: Tier 3D generate validation summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source phase5a2_structural_intermediaries_engine \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "SUCCESS" \
            --runtime-seconds "0" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Tier 3F operational trend intelligence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli trend analyze

      - name: Upload Phase 5A2 execution logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase5a2-structural-intermediaries-execution-logs
          path: |
            logs/platform_execution_consistency.json
            logs/platform_operational_trend_summary.json
            logs/platform_recurring_warnings.json
            logs/platform_runtime_drift_summary.json
            logs/platform_workflow_health_score.json
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
