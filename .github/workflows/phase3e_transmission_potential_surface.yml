name: Phase 3E Transmission Potential Surface

on:
  workflow_dispatch:
    inputs:
      anchor_theme_name:
        description: "Anchor theme name"
        required: true
        default: "ai"
      theme_name:
        description: "Optional theme filter"
        required: false
        default: ""
      max_rows:
        description: "Max rows"
        required: true
        default: "20000"

jobs:
  phase3e-transmission-potential:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANCHOR_THEME_NAME: ${{ github.event.inputs.anchor_theme_name }}
      THEME_NAME: ${{ github.event.inputs.theme_name }}
      MAX_ROWS: ${{ github.event.inputs.max_rows }}
      EXECUTION_CONTEXT_FILE: logs/execution_context.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Phase 3E Transmission Potential Surface
        working-directory: transmission_layers/graph_foundation
        run: |
          python phase3e_transmission_potential_surface.py

      - name: Ensure logs directory exists
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs

      - name: Resolve execution context (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file "${EXECUTION_CONTEXT_FILE}"

      - name: Summarize validation context (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source phase3e_transmission_potential_surface \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Snapshot telemetry context (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "SUCCESS" \
            --runtime-seconds "0" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Build context artifact manifest (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Tier 3F operational trend intelligence (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli trend analyze

      - name: Upload Phase 3E observability artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase3e-transmission-potential-surface-observability
          path: |
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
            logs/platform_pipeline_index.json
            logs/platform_runtime_summary.json
            logs/platform_validation_summary.json
            logs/platform_operational_summary.json
            logs/platform_execution_consistency.json
            logs/platform_operational_trend_summary.json
            logs/platform_recurring_warnings.json
            logs/platform_runtime_drift_summary.json
            logs/platform_workflow_health_score.json
