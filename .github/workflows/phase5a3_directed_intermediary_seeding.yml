name: Phase 5A.3 Directed Intermediary Seeding

on:
  workflow_dispatch:
    inputs:
      min_confidence:
        description: "Minimum confidence score for active seed rules"
        required: false
        default: "0.60"
      write_main_edges:
        description: "Write seeded edges into structural_theme_graph_edges? Use false first."
        required: false
        default: "false"

jobs:
  directed-intermediary-seeding:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DIRECTED_SEED_MIN_CONFIDENCE: ${{ github.event.inputs.min_confidence }}
      DIRECTED_SEED_WRITE_MAIN_EDGES: ${{ github.event.inputs.write_main_edges }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run directed intermediary seeding engine
        run: |
          cd transmission_layers/graph_foundation/intermediaries
          python directed_intermediary_seeding_engine.py
