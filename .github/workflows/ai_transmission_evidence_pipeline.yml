name: AI Transmission Evidence Pipeline

on:
  workflow_dispatch:

  schedule:
    # Runs twice daily at 08:00 and 20:00 Singapore time
    # GitHub Actions cron uses UTC:
    # 00:00 UTC = 08:00 SGT
    # 12:00 UTC = 20:00 SGT
    - cron: "0 0,12 * * *"

permissions:
  contents: read

jobs:
  ai-transmission-evidence:
    name: Run AI Transmission Evidence Ingestion v1
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      MAX_TRANSMISSION_MAP_ROWS: "100"
      MAX_EVIDENCE_RESULTS_PER_MAP: "3"
      TAVILY_SEARCH_DAYS: "30"
      SLEEP_BETWEEN_MAPS_SECONDS: "0.5"
      EXECUTION_CONTEXT_FILE: logs/execution_context.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify required environment variables
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
          ]

          optional = [
              "TAVILY_API_KEY",
              "OPENAI_API_KEY",
              "OPENAI_MODEL",
          ]

          missing = [name for name in required if not os.getenv(name)]

          if missing:
              print("[ERROR] Missing required secrets/env vars:")
              for name in missing:
                  print(f" - {name}")
              sys.exit(1)

          print("[OK] Required environment variables are present.")

          for name in optional:
              if not os.getenv(name):
                  print(f"[WARN] Optional variable missing: {name}")

          if not os.getenv("TAVILY_API_KEY"):
              print("[WARN] Tavily is missing. Evidence search will be skipped.")

          if not os.getenv("OPENAI_API_KEY"):
              print("[WARN] OpenAI is missing. Fallback keyword scoring will be used.")
          PY

      - name: Run AI transmission evidence ingestion
        run: |
          python ai_transmission/ai_transmission_evidence_ingestion_v1.py


      - name: Tier 3C ensure logs directory exists
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs

      - name: Tier 3C resolve shared execution context
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "ai_transmission_evidence" \
            --requested-run-date-sgt "" \
            --output-file "${EXECUTION_CONTEXT_FILE}"

      - name: Tier 3C export execution context to GitHub env
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context export-github-env \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --github-env-file "${GITHUB_ENV}"

      - name: Tier 3D generate validation summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source ai_transmission_evidence_ingestion_v1 \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "${{ job.status }}" \
            --runtime-seconds "0" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E operational summary aggregation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Tier 3F operational trend intelligence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli trend analyze

      - name: Tier 3G - Persist historical observability
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_DATE_SGT: ${{ env.RUN_DATE_SGT }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/write_observability_history.py

      - name: Upload logs / outputs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-transmission-evidence-artifacts
          path: |
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
            logs/platform_execution_consistency.json
            logs/platform_operational_trend_summary.json
            logs/platform_recurring_warnings.json
            logs/platform_runtime_drift_summary.json
            logs/platform_workflow_health_score.json
          if-no-files-found: ignore

      - name: Confirm workflow completed
        if: success()
        run: |
          echo "[OK] AI Transmission Evidence Pipeline completed successfully."

      - name: Report workflow failure
        if: failure()
        run: |
          echo "[ERROR] AI Transmission Evidence Pipeline failed."
          echo "Check logs above for details."
