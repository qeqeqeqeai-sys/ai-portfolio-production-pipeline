name: Phase 4E Historical Propagation Replay

on:
  workflow_dispatch:
    inputs:
      anchor_theme_name:
        description: "Anchor theme name"
        required: true
        default: "ai"
      theme_name:
        description: "Optional theme filter"
        required: false
        default: ""
      lookback_days:
        description: "Historical replay lookback days"
        required: true
        default: "30"
      max_rows:
        description: "Max rows to read"
        required: true
        default: "50000"

jobs:
  phase4e-historical-propagation-replay:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANCHOR_THEME_NAME: ${{ github.event.inputs.anchor_theme_name }}
      THEME_NAME: ${{ github.event.inputs.theme_name }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
      MAX_ROWS: ${{ github.event.inputs.max_rows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create runtime folders
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs

      - name: Tier 3C resolve shared execution context
        if: always()
        continue-on-error: true
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file logs/execution_context.json

      - name: Run Phase 4E Historical Propagation Replay
        working-directory: transmission_layers/graph_foundation
        run: |
          python phase4e_historical_propagation_replay.py

      - name: Tier 3D generate validation summary
        if: always()
        continue-on-error: true
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file logs/execution_context.json \
            --source phase4e_historical_propagation_replay \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        if: always()
        continue-on-error: true
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "${{ job.status }}" \
            --runtime-seconds 0 \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        if: always()
        continue-on-error: true
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Tier 3F advisory operational trend intelligence
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          python -m core.orchestration_guardrails.cli trend analyze

      - name: Upload Phase 4E execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4e-historical-propagation-replay-logs
          path: |
            logs/platform_pipeline_index.json
            logs/platform_runtime_summary.json
            logs/platform_validation_summary.json
            logs/platform_operational_summary.json
            logs/platform_execution_consistency.json
            logs/platform_operational_trend_summary.json
            logs/platform_recurring_warnings.json
            logs/platform_runtime_drift_summary.json
            logs/platform_workflow_health_score.json
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
          if-no-files-found: ignore
