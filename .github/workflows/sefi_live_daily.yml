name: SEFI Live Daily Accumulation

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Optional UTC snapshot date override (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  ops-live-run1-daily-accumulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      SNAPSHOT_OUTPUT_DIR: reports/ops_live_run1
      OPS_LIVE1_OUTPUT_PATH: reports/ops_live_run1/ops_live1_snapshot.json
      OPS_LIVE2_INPUT_PATH: reports/ops_live_run1/ops_live2_observations.json
      OPS_LIVE2_REPORT_PATH: reports/ops_live_run1/ops_live2_observation_fact_accumulation.md
      OPS_LIVE3_REPORT_PATH: reports/ops_live_run1/ops_live3_structural_state_snapshot.md
      OBS_QUERY4_ECOSYSTEM_BRIEFING_JSON_PATH: reports/ops_live_run1/obs_query4_ecosystem_briefing.json
      OBS_QUERY4_ECOSYSTEM_BRIEFING_MD_PATH: reports/ops_live_run1/obs_query4_ecosystem_briefing.md
      OBS_QUERY4_INVESTIGATION_QUEUE_JSON_PATH: reports/ops_live_run1/obs_query4_investigation_queue.json
      OBS_QUERY4_INVESTIGATION_QUEUE_MD_PATH: reports/ops_live_run1/obs_query4_investigation_queue.md
      DAILY_BRIEFING_JSON_PATH: reports/ops_live_run1/daily_briefing.json
      DAILY_BRIEFING_EMAIL_OUTPUT_DIR: reports/ops_live_run1/daily_briefing_email
      ARTIFACT_RETENTION_DAYS: "14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve UTC snapshot date
        shell: bash
        run: |
          set -euo pipefail
          input_date="${{ github.event.inputs.snapshot_date || '' }}"
          snapshot_date="${input_date:-$(date -u +%F)}"
          if ! [[ "$snapshot_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid snapshot date format; expected YYYY-MM-DD." >&2
            exit 1
          fi
          mkdir -p "$SNAPSHOT_OUTPUT_DIR"
          echo "SNAPSHOT_DATE=$snapshot_date" >> "$GITHUB_ENV"
          echo "snapshot_date=$snapshot_date"

      - name: Preflight operational secrets
        shell: bash
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${FMP_API_KEY:-}" ] || { echo "FMP_API_KEY is required." >&2; exit 1; }
          [ -n "${SUPABASE_URL:-}" ] || { echo "SUPABASE_URL is required." >&2; exit 1; }
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY or SUPABASE_KEY is required." >&2
            exit 1
          fi
          echo "operational_secret_preflight=passed"
          echo "supabase_write_required=true"

      - name: Run OPS-LIVE-1 controlled ingest
        shell: bash
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/run_ops_live1b_50_symbol_operational_ingest.py \
            --snapshot-date "$SNAPSHOT_DATE" \
            --output "$OPS_LIVE1_OUTPUT_PATH"

      - name: Build OPS-LIVE-2 bounded observations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path(os.environ["OPS_LIVE1_OUTPUT_PATH"]).read_text(encoding="utf-8"))
          payload = source.get("ops_live1b_payload", {})
          canonical = payload.get("canonical_tables", {})
          diagnostics = payload.get("diagnostics", {})
          observed_at = payload.get("snapshot_ts") or source.get("snapshot_identity", {}).get("snapshot_ts")
          source_run_id = payload.get("snapshot_id") or source.get("snapshot_identity", {}).get("snapshot_id") or os.environ["SNAPSHOT_DATE"]
          universe_size = max(int(diagnostics.get("symbols_requested") or 0), 1)

          observations = [{
              "observed_at": observed_at,
              "source_phase": "OPS-LIVE-1",
              "source_run_id": source_run_id,
              "entity_type": "phase",
              "entity_id": "OPS-LIVE-1",
              "metric_name": "live_ingestion_completeness",
              "metric_value": float(diagnostics.get("normalization_completeness_percentage") or 0.0) / 100.0,
              "payload_jsonb": {"status": source.get("status"), "symbols_requested": diagnostics.get("symbols_requested"), "symbols_normalized": diagnostics.get("symbols_successfully_normalized")},
          }, {
              "observed_at": observed_at,
              "source_phase": "OPS-LIVE-1",
              "source_run_id": source_run_id,
              "entity_type": "provider",
              "entity_id": "FMP",
              "metric_name": "live_provider_health",
              "metric_value": 1.0 if source.get("status") == "ok" else 0.0,
              "payload_jsonb": {"status": source.get("status"), "invalid_values": diagnostics.get("invalid_values"), "missing_fields": diagnostics.get("missing_fields")},
          }]

          for row in canonical.get("symbol_snapshot_rows", []):
              observations.append({
                  "observed_at": observed_at,
                  "source_phase": "OPS-LIVE-1",
                  "source_run_id": source_run_id,
                  "entity_type": "symbol",
                  "entity_id": row.get("symbol"),
                  "metric_name": "live_symbol_weakness",
                  "metric_value": float(row.get("resilience_pressure") or 0.0),
                  "window_days": 1,
                  "payload_jsonb": {"sector": row.get("sector"), "subsector": row.get("subsector"), "snapshot_id": row.get("snapshot_id")},
              })

          for row in canonical.get("sector_summary_rows", []):
              observations.append({
                  "observed_at": observed_at,
                  "source_phase": "OPS-LIVE-1",
                  "source_run_id": source_run_id,
                  "entity_type": "sector",
                  "entity_id": row.get("sector"),
                  "metric_name": "live_sector_concentration",
                  "metric_value": float(row.get("symbol_count") or 0.0) / universe_size,
                  "window_days": 1,
                  "payload_jsonb": {"symbol_count": row.get("symbol_count"), "snapshot_id": row.get("snapshot_id")},
              })

          Path(os.environ["OPS_LIVE2_INPUT_PATH"]).write_text(json.dumps(observations, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"ops_live2_observation_rows={len(observations)}")
          PY

      - name: Run OPS-LIVE-2 fact accumulation
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          python scripts/run_ops_live2_observation_fact_accumulation.py \
            --input-json "$OPS_LIVE2_INPUT_PATH" \
            --report-path "$OPS_LIVE2_REPORT_PATH" \
            --enable-emission \
            --write-facts

      - name: Run OPS-LIVE-3 structural state snapshot
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          python scripts/run_ops_live3_structural_state_snapshot.py \
            --report-path "$OPS_LIVE3_REPORT_PATH" \
            --use-supabase

      - name: Run OBS-QUERY-4 analyst consumption views
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          python scripts/run_obs_query4_consumption_view.py \
            --view-type ecosystem_briefing \
            --snapshot-date "$SNAPSHOT_DATE" \
            --output-json "$OBS_QUERY4_ECOSYSTEM_BRIEFING_JSON_PATH" \
            --output-md "$OBS_QUERY4_ECOSYSTEM_BRIEFING_MD_PATH"
          python scripts/run_obs_query4_consumption_view.py \
            --view-type investigation_queue \
            --snapshot-date "$SNAPSHOT_DATE" \
            --output-json "$OBS_QUERY4_INVESTIGATION_QUEUE_JSON_PATH" \
            --output-md "$OBS_QUERY4_INVESTIGATION_QUEUE_MD_PATH"

      - name: Generate normalized Daily Briefing JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from transmission_layers.daily_briefing import load_daily_briefing

          output_path = Path(os.environ["DAILY_BRIEFING_JSON_PATH"])
          output_path.parent.mkdir(parents=True, exist_ok=True)
          result = load_daily_briefing(
              selected_date=os.environ.get("SNAPSHOT_DATE"),
              artifact_paths=[
                  os.environ["OBS_QUERY4_ECOSYSTEM_BRIEFING_JSON_PATH"],
                  os.environ["OBS_QUERY4_INVESTIGATION_QUEUE_JSON_PATH"],
              ],
              project_root=Path.cwd(),
          )
          output_path.write_text(json.dumps(result.briefing, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(
              json.dumps(
                  {
                      "status": "ok",
                      "daily_briefing_json_path": str(output_path),
                      "loaded_source_count": len(result.loaded_paths),
                      "warning_count": len(result.warnings),
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Generate Daily Briefing email artifacts and optionally send
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SEFI_EMAIL_ENABLED: ${{ vars.SEFI_EMAIL_ENABLED || 'false' }}
          SEFI_EMAIL_SMTP_HOST: ${{ vars.SEFI_EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
          SEFI_EMAIL_SMTP_PORT: ${{ vars.SEFI_EMAIL_SMTP_PORT || '587' }}
          SEFI_EMAIL_SMTP_USER: ${{ secrets.SEFI_EMAIL_SMTP_USER }}
          SEFI_EMAIL_SMTP_APP_PASSWORD: ${{ secrets.SEFI_EMAIL_SMTP_APP_PASSWORD }}
          SEFI_EMAIL_FROM: ${{ secrets.SEFI_EMAIL_FROM }}
          SEFI_EMAIL_TO: ${{ secrets.SEFI_EMAIL_TO }}
          SEFI_EMAIL_SUBJECT_PREFIX: ${{ vars.SEFI_EMAIL_SUBJECT_PREFIX || 'SEFI Daily Briefing' }}
        run: |
          set -euo pipefail
          if [ ! -f "$DAILY_BRIEFING_JSON_PATH" ]; then
            echo "WARNING: Daily Briefing JSON not found at $DAILY_BRIEFING_JSON_PATH; skipping email artifact generation." >&2
            exit 0
          fi

          send_flag=""
          if [ "${SEFI_EMAIL_ENABLED:-}" = "true" ]; then
            send_flag="--send"
          fi

          python scripts/run_daily_briefing_email.py \
            --input-json "$DAILY_BRIEFING_JSON_PATH" \
            --output-dir "$DAILY_BRIEFING_EMAIL_OUTPUT_DIR" \
            $send_flag

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sefi-live-daily-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.OPS_LIVE1_OUTPUT_PATH }}
            ${{ env.OPS_LIVE2_INPUT_PATH }}
            ${{ env.OPS_LIVE2_REPORT_PATH }}
            ${{ env.OPS_LIVE3_REPORT_PATH }}
            ${{ env.OBS_QUERY4_ECOSYSTEM_BRIEFING_JSON_PATH }}
            ${{ env.OBS_QUERY4_ECOSYSTEM_BRIEFING_MD_PATH }}
            ${{ env.OBS_QUERY4_INVESTIGATION_QUEUE_JSON_PATH }}
            ${{ env.OBS_QUERY4_INVESTIGATION_QUEUE_MD_PATH }}
            ${{ env.DAILY_BRIEFING_JSON_PATH }}
            ${{ env.DAILY_BRIEFING_EMAIL_OUTPUT_DIR }}/daily_email.html
            ${{ env.DAILY_BRIEFING_EMAIL_OUTPUT_DIR }}/daily_email.txt
