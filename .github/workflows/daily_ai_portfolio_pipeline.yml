name: Daily AI Portfolio Production Pipeline

on:
  workflow_dispatch:

  schedule:
    # 05:30 Singapore time (UTC+8)
    # GitHub cron uses UTC
    - cron: "30 21 * * 1-5"

concurrency:
  group: daily-ai-portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Singapore
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime folders
        run: |
          mkdir -p logs outputs

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "FMP_API_KEY",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              raise SystemExit(f"Missing required GitHub Secrets: {missing}")

          print("All required secrets are present.")
          PY

      - name: Run Step 1 - Daily stock alpha scoring
        run: |          
          python scripts/ai_signal_scoring_v7_alpha_model_efficiency_github_actions.py 2>&1 | tee logs/01_signal_scoring.log

      - name: Run Step 2 - Portfolio engine
        run: |          
          python scripts/ai_portfolio_engine_v7_alpha_score_github_actions.py 2>&1 | tee logs/02_portfolio_engine.log

      - name: Run Step 3 - Monitoring report
        run: |          
          python scripts/ai_portfolio_monitoring_v1_github_actions.py 2>&1 | tee logs/03_monitoring.log

      - name: Upload logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-portfolio-production-artifacts
          path: |
            logs/
            outputs/
            *.csv
            *.png
            *.xlsx
          if-no-files-found: warn
          retention-days: 14

      - name: Send Telegram failure notification
        if: failure()
        run: |
          MESSAGE="🚨 AI Portfolio Pipeline FAILED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0ATime: $(date '+%Y-%m-%d %H:%M:%S %Z')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"

      - name: Send Telegram success notification
        if: success()
        run: |
          SUMMARY_FILE=$(ls outputs/ai_portfolio_v7_summary_*.csv 2>/dev/null | head -n 1)

          if [ -f "$SUMMARY_FILE" ]; then
            SIGNAL_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("signal_rows", ["NA"])[0])
          PY
          )

            PORTFOLIO_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("portfolio_rows", ["NA"])[0])
          PY
          )

            CASH_WEIGHT=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("cash_weight", ["NA"])[0])
          PY
          )

            TOP_ALPHA=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("top_alpha_ticker", ["NA"])[0])
          PY
          )
          else
            SIGNAL_ROWS="NA"
            PORTFOLIO_ROWS="NA"
            CASH_WEIGHT="NA"
            TOP_ALPHA="NA"
          fi

          MESSAGE="✅ AI Portfolio Pipeline COMPLETED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0ASignal rows: ${SIGNAL_ROWS}%0APortfolio rows: ${PORTFOLIO_ROWS}%0ACash weight: ${CASH_WEIGHT}%0ATop alpha: ${TOP_ALPHA}%0ATime: $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"
