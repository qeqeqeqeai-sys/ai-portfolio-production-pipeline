name: Daily AI Portfolio Production Pipeline

on:
  workflow_dispatch:
    inputs:
      run_date_sgt:
        description: "Optional run_date_sgt override, YYYY-MM-DD"
        required: false
        default: ""
      theme_name:
        description: "Theme name"
        required: false
        default: "ai"

  schedule:
    # 05:30 Singapore time, Tuesday to Saturday
    # GitHub cron uses UTC
    - cron: "30 21 * * 1-5"

concurrency:
  group: daily-ai-portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Singapore
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}


      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      PIPELINE_NAME: AI_PORTFOLIO_PRODUCTION
      ENVIRONMENT: prod
      OUTPUTS_DIR: outputs
      LOGS_DIR: logs
      ARCHIVE_STAGING_DIR: archive_staging
      ARCHIVE_BUCKET: ai-production-archives
      EXECUTION_CONTEXT_FILE: logs/execution_context.json
      DAILY_CONTEXT_UPDATE_FILE: logs/daily_ai_portfolio_generation_context.json
      VALIDATION_SUMMARY_FILE: logs/validation_summary.json
      TELEMETRY_CONTEXT_SNAPSHOT_FILE: logs/telemetry_context_snapshot.json
      CONTEXT_ARTIFACT_MANIFEST_FILE: logs/context_artifact_manifest.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime folders
        run: |
          mkdir -p logs outputs archive_staging

      - name: Record pipeline start time
        run: |
          echo "PIPELINE_START_TS=$(date +%s)" >> $GITHUB_ENV
          echo "PIPELINE_START_SGT=$(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')" >> $GITHUB_ENV

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "FMP_API_KEY",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              raise SystemExit(f"Missing required GitHub Secrets: {missing}")

          print("All required secrets are present.")
          PY

      # ------------------------------------------------------------------
      # Tier 3C — Shared execution context
      # ------------------------------------------------------------------
      - name: Resolve shared execution context
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${{ github.event.inputs.theme_name || 'ai' }}" \
            --requested-run-date-sgt "${{ github.event.inputs.run_date_sgt || '' }}" \
            --output-file "$EXECUTION_CONTEXT_FILE"

      - name: Export initial execution context to GitHub env
        run: |
          python -m core.orchestration_guardrails.cli context export-github-env \
            --context-file "$EXECUTION_CONTEXT_FILE" \
            --github-env-file "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Tier 3B — Advisory-only orchestration preflight
      # ------------------------------------------------------------------
      - name: Tier 3B preflight orchestration guardrails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDRAILS_STRICT_MODE: "false"
          GUARDRAILS_EXPECTED_WORKFLOW_ROLE: "daily_ai_portfolio"
        run: |
          python -m core.orchestration_guardrails.cli preflight \
            --workflow-name "${{ github.workflow }}" \
            --theme-name "$THEME_NAME"

      - name: Run Step 1 - Daily stock alpha scoring
        run: |
          python scripts/ai_signal_scoring_v7_alpha_model_efficiency_github_actions.py 2>&1 | tee logs/01_signal_scoring.log

      - name: Run Step 2 - Portfolio engine
        run: |
          python scripts/ai_portfolio_engine_v7_alpha_score_github_actions.py 2>&1 | tee logs/02_portfolio_engine.log

      - name: Run Step 3 - Monitoring report
        run: |
          python scripts/ai_portfolio_monitoring_v1_github_actions.py 2>&1 | tee logs/03_monitoring.log

      - name: Verify and prepare metrics summary file
        if: success()
        run: |
          echo "Checking for metrics summary file..."

          if [ -f "outputs/ai_portfolio_v7_summary_latest.csv" ]; then
            echo "Found outputs/ai_portfolio_v7_summary_latest.csv"
            exit 0
          fi

          SUMMARY_FILE=$(ls outputs/ai_portfolio_v7_summary_*.csv 2>/dev/null | head -n 1)

          if [ -f "$SUMMARY_FILE" ]; then
            echo "Using summary CSV: $SUMMARY_FILE"
            cp "$SUMMARY_FILE" outputs/ai_portfolio_v7_summary_latest.csv
            exit 0
          fi

          PORTFOLIO_JSON=$(ls outputs/portfolio_engine_v7_summary_*.json 2>/dev/null | head -n 1)

          if [ -f "$PORTFOLIO_JSON" ]; then
            echo "Using fallback portfolio summary JSON: $PORTFOLIO_JSON"

            python - <<PY
          import json
          import pandas as pd

          json_file = "$PORTFOLIO_JSON"

          with open(json_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              data = data[0] if data else {}

          row = {
              "run_date_sgt_requested": data.get("run_date_sgt"),
              "signal_date_used": data.get("run_date_sgt"),
              "portfolio_date_used": data.get("run_date_sgt"),
              "signal_rows": data.get("signal_rows", 0),
              "portfolio_rows": data.get("portfolio_rows", 0),
              "equity_holdings": data.get("equity_holdings", 0),
              "subsectors_in_signal_universe": data.get("subsectors_in_signal_universe", 0),
              "subsectors_in_portfolio": data.get("subsectors_in_portfolio", 0),
              "total_portfolio_weight": data.get("total_portfolio_weight", 0),
              "cash_weight": data.get("cash_weight", 0),
              "equity_weight": data.get("equity_weight", 0),
              "avg_alpha_score": data.get("avg_alpha_score", data.get("avg_alpha_all", 0)),
              "top_alpha_ticker": data.get("top_alpha_ticker", ""),
              "status": "OK",
          }

          pd.DataFrame([row]).to_csv(
              "outputs/ai_portfolio_v7_summary_latest.csv",
              index=False
          )
          PY

            exit 0
          fi

          echo "ERROR: No suitable summary file found."
          ls -la outputs || true
          exit 1

      - name: Normalize daily portfolio run date into execution context update JSON
        if: success()
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          summary_file = Path("outputs/ai_portfolio_v7_summary_latest.csv")
          output_file = Path(os.getenv("DAILY_CONTEXT_UPDATE_FILE", "logs/daily_ai_portfolio_generation_context.json"))
          output_file.parent.mkdir(parents=True, exist_ok=True)

          run_date_sgt = os.getenv("RUN_DATE_SGT", "")
          source_field = "RUN_DATE_SGT_env_fallback"

          if summary_file.exists():
              with summary_file.open("r", encoding="utf-8-sig", newline="") as f:
                  rows = list(csv.DictReader(f))

              row = rows[0] if rows else {}
              candidates = [
                  "portfolio_date_used",
                  "signal_date_used",
                  "run_date_sgt_requested",
                  "run_date_sgt",
              ]

              for field in candidates:
                  value = str(row.get(field, "") or "").strip()
                  if value and value.lower() not in {"nan", "none", "na"}:
                      run_date_sgt = value
                      source_field = field
                      break

          payload = {
              "run_date_sgt": run_date_sgt,
              "source_field": source_field,
              "source_file": str(summary_file),
          }

          with output_file.open("w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, sort_keys=True)

          print(f"Normalized daily AI portfolio run_date_sgt={run_date_sgt}")
          print(f"Source field={source_field}")
          print(f"Wrote context update JSON to {output_file}")
          PY

      - name: Update execution context from daily portfolio output
        if: success()
        run: |
          python -m core.orchestration_guardrails.cli context update-from-json \
            --context-file "$EXECUTION_CONTEXT_FILE" \
            --source-json "$DAILY_CONTEXT_UPDATE_FILE" \
            --field run_date_sgt \
            --target-field resolved_run_date_sgt

      - name: Export final execution context to GitHub env
        if: success()
        run: |
          python -m core.orchestration_guardrails.cli context export-github-env \
            --context-file "$EXECUTION_CONTEXT_FILE" \
            --github-env-file "$GITHUB_ENV"

      - name: Run Step 4 - Production validation gates
        if: success()
        run: |
          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          echo "Pipeline runtime seconds before validation: $PIPELINE_RUNTIME_SECONDS"

          PIPELINE_RUNTIME_SECONDS=$PIPELINE_RUNTIME_SECONDS \
          python scripts/run_production_validation_gates.py 2>&1 | tee logs/04_validation_gates.log

      - name: Mark pipeline success
        if: success()
        run: |
          echo "PIPELINE_STATUS=SUCCESS" >> $GITHUB_ENV

      - name: Mark pipeline failure
        if: failure()
        run: |
          echo "PIPELINE_STATUS=FAILED" >> $GITHUB_ENV

      - name: Write pipeline runtime metrics
        if: success()
        run: |
          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          echo "Pipeline runtime seconds: $PIPELINE_RUNTIME_SECONDS"
          echo "PIPELINE_RUNTIME_SECONDS=$PIPELINE_RUNTIME_SECONDS" >> $GITHUB_ENV

          PIPELINE_RUNTIME_SECONDS=$PIPELINE_RUNTIME_SECONDS \
          python scripts/write_pipeline_metrics.py 2>&1 | tee logs/05_pipeline_metrics.log

      - name: Write pipeline failure metrics
        if: failure()
        run: |
          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          echo "Pipeline runtime seconds: $PIPELINE_RUNTIME_SECONDS"

          PIPELINE_RUNTIME_SECONDS=$PIPELINE_RUNTIME_SECONDS \
          python scripts/write_pipeline_failure_metrics.py 2>&1 | tee logs/06_pipeline_failure_metrics.log

      # ------------------------------------------------------------------
      # Tier 3D — Context-aware validation, telemetry and artifact manifest
      # ------------------------------------------------------------------
      - name: Prepare Tier 3D validation summary inputs
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          report_file = Path("outputs/validation_report.json")

          validation_status = "passed"
          warnings_count = 0
          errors_count = 0
          hard_fail_count = 0

          if report_file.exists():
              with report_file.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              raw_status = str(data.get("status", "passed") or "passed").strip().lower()
              validation_status = raw_status
              warnings_count = int(data.get("warning_count", data.get("warnings_count", 0)) or 0)
              errors_count = int(data.get("error_count", data.get("errors_count", 0)) or 0)
              hard_fail_count = int(data.get("hard_fail_count", data.get("hard_fails_count", 0)) or 0)

              results = data.get("results", [])
              if isinstance(results, list):
                  errors_count = max(
                      errors_count,
                      sum(
                          1
                          for r in results
                          if not r.get("passed", True)
                          and str(r.get("severity", "")).lower() in {"error", "critical"}
                      ),
                  )
                  hard_fail_count = max(
                      hard_fail_count,
                      sum(
                          1
                          for r in results
                          if not r.get("passed", True)
                          and str(r.get("severity", "")).lower() in {"hard_fail", "fatal"}
                      ),
                  )

          print(f"TIER3D_VALIDATION_STATUS={validation_status}")
          print(f"TIER3D_WARNINGS_COUNT={warnings_count}")
          print(f"TIER3D_ERRORS_COUNT={errors_count}")
          print(f"TIER3D_HARD_FAIL_COUNT={hard_fail_count}")
          PY

      - name: Generate Tier 3D validation summary
        if: success()
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "$EXECUTION_CONTEXT_FILE" \
            --source production_validation_gate \
            --validation-status "${TIER3D_VALIDATION_STATUS:-passed}" \
            --warnings-count "${TIER3D_WARNINGS_COUNT:-0}" \
            --errors-count "${TIER3D_ERRORS_COUNT:-0}" \
            --hard-fail-count "${TIER3D_HARD_FAIL_COUNT:-0}" \
            --output-file "$VALIDATION_SUMMARY_FILE"

      - name: Generate Tier 3D telemetry context snapshot
        if: success()
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "$EXECUTION_CONTEXT_FILE" \
            --validation-summary-file "$VALIDATION_SUMMARY_FILE" \
            --pipeline-status "${PIPELINE_STATUS:-SUCCESS}" \
            --runtime-seconds "${PIPELINE_RUNTIME_SECONDS:-0}" \
            --output-file "$TELEMETRY_CONTEXT_SNAPSHOT_FILE"

      - name: Generate Tier 3D context artifact manifest
        if: success()
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "$EXECUTION_CONTEXT_FILE" \
            --validation-summary-file "$VALIDATION_SUMMARY_FILE" \
            --telemetry-snapshot-file "$TELEMETRY_CONTEXT_SNAPSHOT_FILE" \
            --output-file "$CONTEXT_ARTIFACT_MANIFEST_FILE"

      - name: Persistent archive production reports to Supabase Storage
        id: persistent_archive
        if: always()
        continue-on-error: false
        run: |
          python scripts/archive_production_reports.py 2>&1 | tee logs/07_persistent_archive.log

      - name: Send Telegram archival failure notification
        if: always() && steps.persistent_archive.outcome == 'failure'
        continue-on-error: true
        run: |
          python scripts/notify_archival_failure.py 2>&1 | tee logs/08_notify_archival_failure.log

      - name: Send Telegram failure notification
        if: failure()
        run: |
          VALIDATION_SUMMARY=""

          if [ -f "outputs/validation_report.json" ]; then
            VALIDATION_SUMMARY=$(python - <<'PY'
          import json

          with open("outputs/validation_report.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          failed = [r for r in data.get("results", []) if not r.get("passed", True)]

          lines = [
              f"Validation status: {data.get('status', 'NA')}",
              f"Warnings: {data.get('warning_count', 'NA')}",
              f"Errors: {data.get('error_count', 'NA')}",
              f"Hard fails: {data.get('hard_fail_count', 'NA')}",
          ]

          for r in failed[:5]:
              lines.append(
                  f"{r.get('severity', 'NA')} - {r.get('check_name', 'NA')}"
              )

          print("%0A".join(lines))
          PY
          )
          else
            VALIDATION_SUMMARY="Validation report: not available"
          fi

          MESSAGE="🚨 AI Portfolio Pipeline FAILED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0A${VALIDATION_SUMMARY}%0ATime: $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"

      - name: Send Telegram success notification
        if: success()
        run: |
          SUMMARY_FILE="outputs/ai_portfolio_v7_summary_latest.csv"

          if [ -f "$SUMMARY_FILE" ]; then
            SIGNAL_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("signal_rows", ["NA"])[0])
          PY
          )

            PORTFOLIO_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("portfolio_rows", ["NA"])[0])
          PY
          )

            CASH_WEIGHT=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("cash_weight", ["NA"])[0])
          PY
          )

            TOP_ALPHA=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("top_alpha_ticker", ["NA"])[0])
          PY
          )
          else
            SIGNAL_ROWS="NA"
            PORTFOLIO_ROWS="NA"
            CASH_WEIGHT="NA"
            TOP_ALPHA="NA"
          fi

          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          MESSAGE="✅ AI Portfolio Pipeline COMPLETED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0ASignal rows: ${SIGNAL_ROWS}%0APortfolio rows: ${PORTFOLIO_ROWS}%0ACash weight: ${CASH_WEIGHT}%0ATop alpha: ${TOP_ALPHA}%0ARuntime: ${PIPELINE_RUNTIME_SECONDS}s%0ATime: $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"

      - name: Upload logs, outputs and archive bundle to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-portfolio-production-artifacts-${{ github.run_id }}
          path: |
            logs/
            outputs/
            archive_staging/
          if-no-files-found: warn
          retention-days: 30
 
