name: Daily AI Portfolio Production Pipeline

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC.
    # 00:30 UTC = 08:30 Singapore time.
    - cron: "30 0 * * *"

concurrency:
  group: daily-ai-portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Singapore
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime folders
        run: |
          mkdir -p logs outputs

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "FMP_API_KEY",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              raise SystemExit(f"Missing required GitHub Secrets: {missing}")

          print("All required secrets are present.")
          PY

      - name: Run Step 1 - Daily stock alpha scoring
        run: |
          python scripts/ai_signal_scoring_v7_alpha_model_efficiency_enabled.py 2>&1 | tee logs/01_signal_scoring.log

      - name: Run Step 2 - Portfolio engine
        run: |
          python scripts/ai_portfolio_engine_v7_alpha_score.py 2>&1 | tee logs/02_portfolio_engine.log

      - name: Run Step 3 - Monitoring report
        run: |
          python scripts/ai_portfolio_monitoring_v1.py 2>&1 | tee logs/03_monitoring.log

      - name: Upload logs and monitoring outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-portfolio-production-artifacts
          path: |
            logs/
            outputs/
            *.csv
            *.png
            *.jpg
            *.xlsx
            *.html
            *.pdf
          if-no-files-found: warn
          retention-days: 14
