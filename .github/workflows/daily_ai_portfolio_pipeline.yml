name: Daily AI Portfolio Production Pipeline

on:
  workflow_dispatch:

  schedule:
    # 05:30 Singapore time (UTC+8)
    # GitHub cron uses UTC
    - cron: "30 21 * * 1-5"

concurrency:
  group: daily-ai-portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Singapore
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime folders
        run: |
          mkdir -p logs outputs

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "FMP_API_KEY",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              raise SystemExit(f"Missing required GitHub Secrets: {missing}")

          print("All required secrets are present.")
          PY

      - name: Run Step 1 - Daily stock alpha scoring
        run: |
          python scripts/ai_signal_scoring_v7_alpha_model_efficiency_github_actions.py 2>&1 | tee logs/01_signal_scoring.log

      - name: Run Step 2 - Portfolio engine
        run: |
          python scripts/ai_portfolio_engine_v7_alpha_score_github_actions.py 2>&1 | tee logs/02_portfolio_engine.log

      - name: Run Step 3 - Monitoring report
        run: |
          python scripts/ai_portfolio_monitoring_v1_github_actions.py 2>&1 | tee logs/03_monitoring.log

      - name: Verify and prepare metrics summary file
        if: success()
        run: |
          echo "Listing outputs after monitoring:"
          find outputs -maxdepth 1 -type f -print | sort

          python - <<'PY' 2>&1 | tee logs/03b_prepare_metrics_summary.log
          from pathlib import Path
          import json
          import pandas as pd

          out = Path("outputs")
          out.mkdir(exist_ok=True)

          latest = out / "ai_portfolio_v7_summary_latest.csv"

          if latest.exists():
              print(f"[OK] Found existing latest summary: {latest}")
              raise SystemExit(0)

          # Preferred source: monitoring-created dated summary CSV
          candidates = sorted(out.glob("ai_portfolio_v7_summary_*.csv"), reverse=True)
          candidates = [p for p in candidates if p.name != "ai_portfolio_v7_summary_latest.csv"]

          if candidates:
              src = candidates[0]
              latest.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
              print(f"[OK] Created {latest} from {src}")
              raise SystemExit(0)

          # Fallback source: portfolio engine summary JSON
          json_candidates = sorted(out.glob("portfolio_engine_v7_summary_*.json"), reverse=True)

          if json_candidates:
              src = json_candidates[0]
              data = json.loads(src.read_text(encoding="utf-8"))

              if isinstance(data, list):
                  if not data:
                      raise RuntimeError(f"Portfolio summary JSON is empty: {src}")
                  data = data[0]

              if not isinstance(data, dict):
                  raise RuntimeError(f"Unexpected portfolio summary JSON format: {src}")

              # Normalize common portfolio-engine summary fields into what write_pipeline_metrics.py expects.
              row = {
                  "run_date_sgt": data.get("run_date_sgt") or data.get("run_date") or data.get("date"),
                  "signal_rows": data.get("signal_rows") or data.get("input_rows") or data.get("score_rows"),
                  "portfolio_rows": data.get("portfolio_rows") or data.get("rows") or data.get("holdings") or data.get("equity_holdings"),
                  "subsectors": data.get("subsectors") or data.get("subsectors_in_signal_universe"),
                  "portfolio_subsectors": data.get("portfolio_subsectors") or data.get("subsectors_in_portfolio"),
                  "cash_weight": data.get("cash_weight"),
                  "avg_alpha_score": data.get("avg_alpha_score") or data.get("avg_portfolio_alpha"),
                  "top_alpha_ticker": data.get("top_alpha_ticker"),
              }

              # Keep all original JSON fields too, in case future metrics need them.
              for k, v in data.items():
                  row.setdefault(k, v)

              pd.DataFrame([row]).to_csv(latest, index=False)
              print(f"[OK] Created {latest} from fallback JSON {src}")
              raise SystemExit(0)

          raise RuntimeError(
              "Could not create ai_portfolio_v7_summary_latest.csv. "
              "No monitoring summary CSV or portfolio_engine_v7_summary JSON found in outputs/."
          )
          PY

      - name: Write pipeline runtime metrics
        if: success()
        run: |
          python scripts/write_pipeline_metrics.py 2>&1 | tee logs/04_pipeline_metrics.log

      - name: Write pipeline failure metrics
        if: failure()
        run: |
          python scripts/write_pipeline_failure_metrics.py 2>&1 | tee logs/05_pipeline_failure_metrics.log

      - name: Upload logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-portfolio-production-artifacts
          path: |
            logs/
            outputs/
            *.csv
            *.png
            *.xlsx
          if-no-files-found: warn
          retention-days: 14

      - name: Send Telegram failure notification
        if: failure()
        run: |
          MESSAGE="🚨 AI Portfolio Pipeline FAILED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0ATime: $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"

      - name: Send Telegram success notification
        if: success()
        run: |
          SUMMARY_FILE=$(ls outputs/ai_portfolio_v7_summary_latest.csv 2>/dev/null | head -n 1)

          if [ -f "$SUMMARY_FILE" ]; then
            SIGNAL_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("signal_rows", ["NA"])[0])
          PY
          )

            PORTFOLIO_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("portfolio_rows", ["NA"])[0])
          PY
          )

            CASH_WEIGHT=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("cash_weight", ["NA"])[0])
          PY
          )

            TOP_ALPHA=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("top_alpha_ticker", ["NA"])[0])
          PY
          )
          else
            SIGNAL_ROWS="NA"
            PORTFOLIO_ROWS="NA"
            CASH_WEIGHT="NA"
            TOP_ALPHA="NA"
          fi

          MESSAGE="✅ AI Portfolio Pipeline COMPLETED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0ASignal rows: ${SIGNAL_ROWS}%0APortfolio rows: ${PORTFOLIO_ROWS}%0ACash weight: ${CASH_WEIGHT}%0ATop alpha: ${TOP_ALPHA}%0ATime: $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"
