name: Daily AI Portfolio Production Pipeline

on:
  workflow_dispatch:

  schedule:
    # 05:30 Singapore time, Tuesday to Saturday
    # GitHub cron uses UTC
    - cron: "30 21 * * 1-5"

concurrency:
  group: daily-ai-portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Singapore
      PYTHONUNBUFFERED: "1"

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      PIPELINE_NAME: AI_PORTFOLIO_PRODUCTION
      ENVIRONMENT: prod
      OUTPUTS_DIR: outputs
      LOGS_DIR: logs
      ARCHIVE_STAGING_DIR: archive_staging
      ARCHIVE_BUCKET: ai-production-archives

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime folders
        run: |
          mkdir -p logs outputs archive_staging

      - name: Record pipeline start time
        run: |
          echo "PIPELINE_START_TS=$(date +%s)" >> $GITHUB_ENV
          echo "PIPELINE_START_SGT=$(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')" >> $GITHUB_ENV

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "FMP_API_KEY",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              raise SystemExit(f"Missing required GitHub Secrets: {missing}")

          print("All required secrets are present.")
          PY

      # ------------------------------------------------------------------
      # Tier 3B — Advisory-only orchestration preflight
      # ------------------------------------------------------------------
      - name: Tier 3B preflight orchestration guardrails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDRAILS_STRICT_MODE: "false"
          GUARDRAILS_EXPECTED_WORKFLOW_ROLE: "daily_ai_portfolio"
        run: |
          python -m core.orchestration_guardrails.cli preflight \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}"

      - name: Run Step 1 - Daily stock alpha scoring
        run: |
          python scripts/ai_signal_scoring_v7_alpha_model_efficiency_github_actions.py 2>&1 | tee logs/01_signal_scoring.log

      - name: Run Step 2 - Portfolio engine
        run: |
          python scripts/ai_portfolio_engine_v7_alpha_score_github_actions.py 2>&1 | tee logs/02_portfolio_engine.log

      - name: Run Step 3 - Monitoring report
        run: |
          python scripts/ai_portfolio_monitoring_v1_github_actions.py 2>&1 | tee logs/03_monitoring.log

      - name: Verify and prepare metrics summary file
        if: success()
        run: |
          echo "Checking for metrics summary file..."

          if [ -f "outputs/ai_portfolio_v7_summary_latest.csv" ]; then
            echo "Found outputs/ai_portfolio_v7_summary_latest.csv"
            exit 0
          fi

          SUMMARY_FILE=$(ls outputs/ai_portfolio_v7_summary_*.csv 2>/dev/null | head -n 1)

          if [ -f "$SUMMARY_FILE" ]; then
            echo "Using summary CSV: $SUMMARY_FILE"
            cp "$SUMMARY_FILE" outputs/ai_portfolio_v7_summary_latest.csv
            exit 0
          fi

          PORTFOLIO_JSON=$(ls outputs/portfolio_engine_v7_summary_*.json 2>/dev/null | head -n 1)

          if [ -f "$PORTFOLIO_JSON" ]; then
            echo "Using fallback portfolio summary JSON: $PORTFOLIO_JSON"

            python - <<PY
          import json
          import pandas as pd

          json_file = "$PORTFOLIO_JSON"

          with open(json_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              data = data[0] if data else {}

          row = {
              "run_date_sgt_requested": data.get("run_date_sgt"),
              "signal_date_used": data.get("run_date_sgt"),
              "portfolio_date_used": data.get("run_date_sgt"),
              "signal_rows": data.get("signal_rows", 0),
              "portfolio_rows": data.get("portfolio_rows", 0),
              "equity_holdings": data.get("equity_holdings", 0),
              "subsectors_in_signal_universe": data.get("subsectors_in_signal_universe", 0),
              "subsectors_in_portfolio": data.get("subsectors_in_portfolio", 0),
              "total_portfolio_weight": data.get("total_portfolio_weight", 0),
              "cash_weight": data.get("cash_weight", 0),
              "equity_weight": data.get("equity_weight", 0),
              "avg_alpha_score": data.get("avg_alpha_score", data.get("avg_alpha_all", 0)),
              "top_alpha_ticker": data.get("top_alpha_ticker", ""),
              "status": "OK",
          }

          pd.DataFrame([row]).to_csv(
              "outputs/ai_portfolio_v7_summary_latest.csv",
              index=False
          )
          PY

            exit 0
          fi

          echo "ERROR: No suitable summary file found."
          ls -la outputs || true
          exit 1

      - name: Run Step 4 - Production validation gates
        if: success()
        run: |
          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          echo "Pipeline runtime seconds before validation: $PIPELINE_RUNTIME_SECONDS"

          PIPELINE_RUNTIME_SECONDS=$PIPELINE_RUNTIME_SECONDS \
          python scripts/run_production_validation_gates.py 2>&1 | tee logs/04_validation_gates.log

      - name: Mark pipeline success
        if: success()
        run: |
          echo "PIPELINE_STATUS=SUCCESS" >> $GITHUB_ENV

      - name: Mark pipeline failure
        if: failure()
        run: |
          echo "PIPELINE_STATUS=FAILED" >> $GITHUB_ENV

      - name: Write pipeline runtime metrics
        if: success()
        run: |
          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          echo "Pipeline runtime seconds: $PIPELINE_RUNTIME_SECONDS"

          PIPELINE_RUNTIME_SECONDS=$PIPELINE_RUNTIME_SECONDS \
          python scripts/write_pipeline_metrics.py 2>&1 | tee logs/05_pipeline_metrics.log

      - name: Write pipeline failure metrics
        if: failure()
        run: |
          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          echo "Pipeline runtime seconds: $PIPELINE_RUNTIME_SECONDS"

          PIPELINE_RUNTIME_SECONDS=$PIPELINE_RUNTIME_SECONDS \
          python scripts/write_pipeline_failure_metrics.py 2>&1 | tee logs/06_pipeline_failure_metrics.log

      - name: Persistent archive production reports to Supabase Storage
        id: persistent_archive
        if: always()
        continue-on-error: false
        run: |
          python scripts/archive_production_reports.py 2>&1 | tee logs/07_persistent_archive.log

      - name: Send Telegram archival failure notification
        if: always() && steps.persistent_archive.outcome == 'failure'
        continue-on-error: true
        run: |
          python scripts/notify_archival_failure.py 2>&1 | tee logs/08_notify_archival_failure.log

      - name: Send Telegram failure notification
        if: failure()
        run: |
          VALIDATION_SUMMARY=""

          if [ -f "outputs/validation_report.json" ]; then
            VALIDATION_SUMMARY=$(python - <<'PY'
          import json

          with open("outputs/validation_report.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          failed = [r for r in data.get("results", []) if not r.get("passed", True)]

          lines = [
              f"Validation status: {data.get('status', 'NA')}",
              f"Warnings: {data.get('warning_count', 'NA')}",
              f"Errors: {data.get('error_count', 'NA')}",
              f"Hard fails: {data.get('hard_fail_count', 'NA')}",
          ]

          for r in failed[:5]:
              lines.append(
                  f"{r.get('severity', 'NA')} - {r.get('check_name', 'NA')}"
              )

          print("%0A".join(lines))
          PY
          )
          else
            VALIDATION_SUMMARY="Validation report: not available"
          fi

          MESSAGE="🚨 AI Portfolio Pipeline FAILED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0A${VALIDATION_SUMMARY}%0ATime: $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"

      - name: Send Telegram success notification
        if: success()
        run: |
          SUMMARY_FILE="outputs/ai_portfolio_v7_summary_latest.csv"

          if [ -f "$SUMMARY_FILE" ]; then
            SIGNAL_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("signal_rows", ["NA"])[0])
          PY
          )

            PORTFOLIO_ROWS=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("portfolio_rows", ["NA"])[0])
          PY
          )

            CASH_WEIGHT=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("cash_weight", ["NA"])[0])
          PY
          )

            TOP_ALPHA=$(python - <<PY
          import pandas as pd
          df = pd.read_csv("$SUMMARY_FILE")
          print(df.get("top_alpha_ticker", ["NA"])[0])
          PY
          )
          else
            SIGNAL_ROWS="NA"
            PORTFOLIO_ROWS="NA"
            CASH_WEIGHT="NA"
            TOP_ALPHA="NA"
          fi

          PIPELINE_END_TS=$(date +%s)
          PIPELINE_RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))

          MESSAGE="✅ AI Portfolio Pipeline COMPLETED%0A%0ARepo: ${{ github.repository }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}%0ASignal rows: ${SIGNAL_ROWS}%0APortfolio rows: ${PORTFOLIO_ROWS}%0ACash weight: ${CASH_WEIGHT}%0ATop alpha: ${TOP_ALPHA}%0ARuntime: ${PIPELINE_RUNTIME_SECONDS}s%0ATime: $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"

      - name: Upload logs, outputs and archive bundle to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-portfolio-production-artifacts-${{ github.run_id }}
          path: |
            logs/
            outputs/
            archive_staging/
          if-no-files-found: warn
          retention-days: 30
 
