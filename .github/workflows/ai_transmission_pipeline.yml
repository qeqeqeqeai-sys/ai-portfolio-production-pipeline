name: AI Transmission Pipeline

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 09:00 Singapore time
    # GitHub Actions cron uses UTC
    # 01:00 UTC = 09:00 SGT
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  ai-transmission-scoring:
    name: Run AI Transmission Scoring v2
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      # Optional runtime tuning
      OBS_LOOKBACK_DAYS: "14"
      PRICE_LOOKBACK_DAYS: "30"
      MAX_TRANSMISSION_MAP_ROWS: "500"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify required environment variables
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
          ]

          missing = [name for name in required if not os.getenv(name)]

          if missing:
              print("[ERROR] Missing required secrets/env vars:")
              for name in missing:
                  print(f" - {name}")
              sys.exit(1)

          print("[OK] Required environment variables are present.")

          if not os.getenv("FMP_API_KEY"):
              print("[WARN] FMP_API_KEY is missing.")
              print("[WARN] Market confirmation will use neutral scores.")
          else:
              print("[OK] FMP market confirmation enabled.")
          PY

      - name: Run AI transmission scoring v2
        run: |
          python ai_transmission/ai_transmission_scoring_v2_phase1_refactor_built.py

      - name: Confirm workflow completed
        if: success()
        run: |
          echo "[OK] AI Transmission Scoring v2 completed successfully."

      - name: Report workflow failure
        if: failure()
        run: |
          echo "[ERROR] AI Transmission Scoring v2 failed."
          echo "Check logs above for details."
