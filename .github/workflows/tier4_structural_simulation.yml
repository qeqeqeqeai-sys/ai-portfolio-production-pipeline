name: Tier4 Structural Simulation

on:
  push:
    paths:
      - 'transmission_layers/intelligence/tier4/**'
      - 'tests/test_tier4_structural_simulation.py'
      - 'tests/test_tier4_structural_memory.py'
      - 'tests/test_tier4_temporal_replay.py'
      - 'tests/test_tier4_replay_integrity.py'
      - 'tests/test_tier4_influence_attribution.py'
      - 'tests/test_tier4_causal_lineage.py'
      - 'tests/test_tier4_causal_replay.py'
      - '.github/workflows/tier4_structural_simulation.yml'
  pull_request:
    paths:
      - 'transmission_layers/intelligence/tier4/**'
      - 'tests/test_tier4_structural_simulation.py'
      - 'tests/test_tier4_structural_memory.py'
      - 'tests/test_tier4_temporal_replay.py'
      - 'tests/test_tier4_replay_integrity.py'
      - 'tests/test_tier4_influence_attribution.py'
      - 'tests/test_tier4_causal_lineage.py'
      - 'tests/test_tier4_causal_replay.py'
      - '.github/workflows/tier4_structural_simulation.yml'
  workflow_dispatch:

jobs:
  tier4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Tier4 tests
        run: |
          python -m pytest -q tests/test_tier4_structural_simulation.py
          python -m pytest -q tests/test_tier4_structural_memory.py
          python -m pytest -q tests/test_tier4_temporal_replay.py
          python -m pytest -q tests/test_tier4_replay_integrity.py
          python -m pytest -q tests/test_tier4_influence_attribution.py
          python -m pytest -q tests/test_tier4_causal_lineage.py
          python -m pytest -q tests/test_tier4_causal_replay.py
      - name: Run Tier4 simulation
        run: python -m transmission_layers.intelligence.tier4.structural_simulation
      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tier4-structural-simulation-logs
          path: |
            logs/tier4_structural_simulation_summary.json
            tier4_structural_simulation_summary.json
            transmission_layers/intelligence/tier4/__init__.py
            transmission_layers/intelligence/tier4/structural_simulation.py
            transmission_layers/intelligence/tier4/state_snapshot.py
            transmission_layers/intelligence/tier4/structural_memory.py
            transmission_layers/intelligence/tier4/temporal_replay.py
            transmission_layers/intelligence/tier4/topology_drift.py
            transmission_layers/intelligence/tier4/topology_hashing.py
            transmission_layers/intelligence/tier4/influence_attribution.py
            transmission_layers/intelligence/tier4/attribution_metrics.py
            transmission_layers/intelligence/tier4/causal_paths.py
            transmission_layers/intelligence/tier4/causal_lineage.py
            transmission_layers/intelligence/tier4/causal_replay.py
            tests/test_tier4_influence_attribution.py
            tests/test_tier4_causal_lineage.py
            tests/test_tier4_causal_replay.py
            tests/test_tier4_structural_simulation.py
            tests/test_tier4_structural_memory.py
            tests/test_tier4_temporal_replay.py
            tests/test_tier4_replay_integrity.py
            logs/tier4*_summary.json
            logs/tier4*_diagnostics.json
            logs/tier4*_replay*.json
            logs/tier4*_memory*.json
          if-no-files-found: warn
