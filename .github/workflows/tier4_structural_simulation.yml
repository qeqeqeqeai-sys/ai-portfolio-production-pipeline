name: Tier4 Structural Simulation

on:
  push:
    paths:
      - 'transmission_layers/intelligence/tier4/**'
      - 'tests/test_tier4_structural_simulation.py'
      - '.github/workflows/tier4_structural_simulation.yml'
  pull_request:
    paths:
      - 'transmission_layers/intelligence/tier4/**'
      - 'tests/test_tier4_structural_simulation.py'
      - '.github/workflows/tier4_structural_simulation.yml'
  workflow_dispatch:

jobs:
  tier4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Tier4 tests
        run: |
          python -m pytest -q tests/test_tier4_structural_simulation.py
      - name: Run Tier4 simulation
        run: python -m transmission_layers.intelligence.tier4.structural_simulation
      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tier4-structural-simulation-logs
          path: logs/tier4_structural_simulation_summary.json
          if-no-files-found: ignore
