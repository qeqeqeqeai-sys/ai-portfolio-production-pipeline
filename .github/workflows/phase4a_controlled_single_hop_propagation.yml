name: Phase 4A Controlled Single-Hop Propagation

on:
  workflow_dispatch:
    inputs:
      anchor_theme_name:
        description: "Anchor theme name"
        required: true
        default: "ai"
      theme_name:
        description: "Optional theme filter"
        required: false
        default: ""
      max_rows:
        description: "Max rows to read"
        required: true
        default: "20000"
      min_edge_strength:
        description: "Minimum edge strength"
        required: true
        default: "0.0"
      min_transmission_potential:
        description: "Minimum transmission potential when available"
        required: true
        default: "0.0"
      max_transfer_weight:
        description: "Maximum transfer weight cap"
        required: true
        default: "0.85"

jobs:
  phase4a-controlled-single-hop-propagation:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANCHOR_THEME_NAME: ${{ github.event.inputs.anchor_theme_name }}
      THEME_NAME: ${{ github.event.inputs.theme_name }}
      MAX_ROWS: ${{ github.event.inputs.max_rows }}
      MIN_EDGE_STRENGTH: ${{ github.event.inputs.min_edge_strength }}
      MIN_TRANSMISSION_POTENTIAL: ${{ github.event.inputs.min_transmission_potential }}
      MAX_TRANSFER_WEIGHT: ${{ github.event.inputs.max_transfer_weight }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Phase 4A Controlled Single-Hop Propagation
        working-directory: transmission_layers/graph_foundation
        run: |
          python phase4a_controlled_single_hop_propagation.py

      - name: Create runtime folders
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs

      - name: Tier 3C resolve shared execution context
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file logs/execution_context.json

      - name: Tier 3D generate validation summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file logs/execution_context.json \
            --source phase4a_controlled_single_hop_propagation \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "${{ job.status }}" \
            --runtime-seconds 0 \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Tier 3F advisory operational trend intelligence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli trend analyze


      - name: Tier 3G advisory historical operational intelligence persistence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_DATE_SGT: ${{ env.RUN_DATE_SGT }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p logs
          if [ -d transmission_layers/graph_foundation/logs ]; then
            cp -f transmission_layers/graph_foundation/logs/*.json logs/ 2>/dev/null || true
          fi
          python scripts/write_observability_history.py

      - name: Upload Phase 4A execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4a-controlled-single-hop-propagation-logs
          path: |
            logs/platform_pipeline_index.json
            logs/platform_runtime_summary.json
            logs/platform_validation_summary.json
            logs/platform_operational_summary.json
            logs/platform_execution_consistency.json
            logs/platform_operational_trend_summary.json
            logs/platform_recurring_warnings.json
            logs/platform_runtime_drift_summary.json
            logs/platform_workflow_health_score.json
            logs/execution_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
          if-no-files-found: ignore
