name: LR6-LIVE5 First Approved Non-Dry Persistence Execution

on:
  workflow_dispatch:
    inputs:
      max_entities:
        description: "Maximum entities (must be <= 5)"
        required: false
        default: "5"
        type: string

jobs:
  live5-first-approved-non-dry-execution:
    runs-on: ubuntu-latest
    env:
      LIVE5_APPROVAL_PHRASE: "LIVE5"
      LIVE5_NON_DRY_EXECUTION_TOKEN: "LIVE5"
      LIVE5_MAX_ENTITIES: ${{ github.event.inputs.max_entities || '5' }}
      LIVE5_METRIC_TARGET: "replay_richness"
      LIVE5_PERSISTENCE_TARGET: "replay_richness_wave0_shadow"
      LIVE5_APPEND_ONLY_CONFIRMATION: "true"
      LIVE5_ROLLBACK_CONFIRMATION: "true"
      LIVE5_LINEAGE_CONFIRMATION: "true"
      LIVE5_SCHEMA_CONFIRMED: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Execute approved LIVE5 non-dry path
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_lr6_live5_first_approved_non_dry_persistence_execution.py

      - name: Upload LIVE5 execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lr6-live5-first-approved-non-dry-execution
          path: |
            outputs/lr6_live5_first_approved_non_dry_persistence_execution_result.json
            reports/lr6_live5_first_approved_non_dry_persistence_execution.md
          if-no-files-found: error
