name: Tier 3H.4B Dynamic Entity Discovery

on:
  workflow_dispatch:
    inputs:
      force_fresh_evidence:
        description: "Force bypass of persisted evidence reuse for this manual run only"
        required: false
        default: "false"
  schedule:
    - cron: "35 1 * * *"

jobs:
  tier3h4-dynamic-entity-discovery:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TIER3H4_TAVILY_ENABLED: ${{ vars.TIER3H4_TAVILY_ENABLED || 'true' }}
      TIER3H4_FORCE_FRESH_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_fresh_evidence == 'true' && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug Tier 3H.4B force-fresh env
        shell: bash
        run: |
          # TEMP DEBUG INSTRUMENTATION FOR FORCE-FRESH VALIDATION
          echo "workflow_dispatch.force_fresh_evidence=${{ github.event.inputs.force_fresh_evidence }}"
          echo "TIER3H4_FORCE_FRESH_EVIDENCE=$TIER3H4_FORCE_FRESH_EVIDENCE"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "RUNNER_OS=$RUNNER_OS"

      - name: Run Tier 3H.4B dynamic entity discovery
        run: |
          python transmission_layers/asset_discovery/tier3h4_dynamic_entity_discovery.py


      - name: Tier 3H.4C.1 audit-only entity resolution dry run
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs
          python transmission_layers/asset_discovery/entity_resolution/resolve_discovered_entities.py

      - name: Resolve orchestration context (advisory)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "tier3h4_dynamic_entity_discovery" \
            --output-file logs/execution_context.json

      - name: Build validation summary (advisory)
        if: always()
        continue-on-error: true
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file logs/execution_context.json \
            --source tier3h4_dynamic_entity_discovery \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/platform_validation_summary.json

      - name: Upload Tier 3H.4B advisory artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tier3h4-dynamic-entity-discovery-logs
          if-no-files-found: warn
          path: |
            logs/tier3h4_dynamic_entity_discovery_summary.json
            logs/tier3h4_dynamic_entity_discovery_validation.json
            logs/tier3h4_dynamic_entity_evidence_summary.json
            logs/tier3h4_operational_controls_summary.json
            logs/tier3h4c_entity_resolution_summary.json
            logs/execution_context.json
            logs/platform_validation_summary.json
