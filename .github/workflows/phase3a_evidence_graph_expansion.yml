name: Phase 3A Evidence Graph Expansion

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: "Theme name"
        required: true
        default: "ai"
      anchor_theme_name:
        description: "Anchor theme name"
        required: true
        default: "ai"
      max_rows_per_source:
        description: "Max rows to read per source table"
        required: true
        default: "1000"

jobs:
  phase3a-evidence-graph-expansion:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      THEME_NAME: ${{ github.event.inputs.theme_name }}
      ANCHOR_THEME_NAME: ${{ github.event.inputs.anchor_theme_name }}
      MAX_ROWS_PER_SOURCE: ${{ github.event.inputs.max_rows_per_source }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Phase 3A Evidence Graph Expansion
        working-directory: transmission_layers/graph_foundation
        run: |
          python phase3a_evidence_graph_expansion.py
