name: Phase 3B Relationship Persistence

on:
  workflow_dispatch:
    inputs:
      anchor_theme_name:
        description: "Anchor theme name"
        required: true
        default: "ai"
      theme_name:
        description: "Optional theme filter. Leave blank for all themes under anchor."
        required: false
        default: ""
      lookback_days:
        description: "Lookback window for persistence analysis"
        required: true
        default: "365"
      max_history_rows:
        description: "Max edge history rows to read"
        required: true
        default: "10000"
      min_observations_for_stability:
        description: "Minimum observations before stable/decay/reinforcement classification"
        required: true
        default: "2"

jobs:
  phase3b-relationship-persistence:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANCHOR_THEME_NAME: ${{ github.event.inputs.anchor_theme_name }}
      THEME_NAME: ${{ github.event.inputs.theme_name }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
      MAX_HISTORY_ROWS: ${{ github.event.inputs.max_history_rows }}
      MIN_OBSERVATIONS_FOR_STABILITY: ${{ github.event.inputs.min_observations_for_stability }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Phase 3B Relationship Persistence
        working-directory: transmission_layers/graph_foundation
        run: |
          python phase3b_relationship_persistence.py

      - name: Resolve orchestration context (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: transmission_layers/graph_foundation
        run: |
          mkdir -p logs
          python -m core.orchestration_guardrails.cli context resolve

      - name: Tier 3C validation summary (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: transmission_layers/graph_foundation
        run: |
          python -m core.orchestration_guardrails.cli validation summarize --context logs/execution_context.json

      - name: Tier 3D telemetry snapshot (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: transmission_layers/graph_foundation
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot --context logs/execution_context.json

      - name: Build artifact manifest (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: transmission_layers/graph_foundation
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest

      - name: Tier 3E operational aggregation (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: transmission_layers/graph_foundation
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary

      - name: Tier 3F operational trend intelligence (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: transmission_layers/graph_foundation
        run: |
          python -m core.orchestration_guardrails.cli trend analyze

      - name: Upload observability artifacts (advisory)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-relationship-persistence-observability
          if-no-files-found: warn
          path: |
            transmission_layers/graph_foundation/logs/execution_context.json
            transmission_layers/graph_foundation/logs/platform_validation_summary.json
            transmission_layers/graph_foundation/logs/platform_runtime_summary.json
            transmission_layers/graph_foundation/logs/platform_pipeline_index.json
            transmission_layers/graph_foundation/logs/platform_operational_summary.json
            transmission_layers/graph_foundation/logs/platform_execution_consistency.json
            transmission_layers/graph_foundation/logs/platform_operational_trend_summary.json
            transmission_layers/graph_foundation/logs/platform_recurring_warnings.json
            transmission_layers/graph_foundation/logs/platform_runtime_drift_summary.json
            transmission_layers/graph_foundation/logs/platform_workflow_health_score.json
            transmission_layers/graph_foundation/logs/artifact_manifest.json
