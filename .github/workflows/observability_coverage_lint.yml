name: Observability Coverage Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/lint_workflow_observability.py'
      - 'scripts/validate_observability_artifacts.py'

jobs:
  observability-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run observability coverage lint
        shell: bash
        run: |
          python scripts/lint_workflow_observability.py

      - name: Run advisory observability artifact schema validation
        shell: bash
        run: |
          python scripts/validate_observability_artifacts.py
