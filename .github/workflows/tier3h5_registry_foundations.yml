name: tier3h5_registry_foundations

on:
  workflow_dispatch:
  push:
    paths:
      - 'transmission_layers/asset_discovery/tier3h5/**'
      - 'transmission_layers/asset_discovery/tier3h4_dynamic_entity_discovery.py'
      - 'tests/test_tier3h5_*'
      - 'transmission_layers/graph_foundation/**'
      - 'transmission_layers/graph_foundation/continuity/**'
      - '.github/workflows/tier3h5_registry_foundations.yml'

jobs:
  run-tier3h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Tier 3H.5 sample execution
        run: |
          python -m transmission_layers.asset_discovery.tier3h5.canonical_registry_ingestion
      - name: Run Tier 3H.5 registry resolution sample
        run: |
          python -m transmission_layers.asset_discovery.tier3h5.canonical_registry_resolution
      - name: Run Tier 3H.5 Phase 2 sample/CLI (if present)
        run: |
          if [ -f "transmission_layers/asset_discovery/tier3h5/registry_propagation_governance.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.registry_propagation_governance
          elif [ -f "transmission_layers/asset_discovery/tier3h5/registry_propagation_governance_cli.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.registry_propagation_governance_cli
          else
            echo "No Tier 3H.5 Phase 2 sample/CLI module found; skipping."
          fi
      - name: Run Tier 3H.5 Phase 2A coverage telemetry (if present)
        run: |
          # Phase 2A expanded security type/exchange telemetry is optional and advisory-only.
          mkdir -p logs

          if [ -f "transmission_layers/asset_discovery/tier3h5/phase2a_coverage_telemetry.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.phase2a_coverage_telemetry
          else
            echo "No Tier 3H.5 Phase 2A coverage telemetry module found; skipping."
          fi

          if [ -f "transmission_layers/asset_discovery/tier3h5/normalization_diagnostics.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.normalization_diagnostics
          else
            echo "No Tier 3H.5 normalization diagnostics module found; skipping."
          fi
      - name: Run Tier 3H.5 Phase 2B registry quality and freshness diagnostics
        run: |
          mkdir -p logs

          if [ -f "transmission_layers/asset_discovery/tier3h5/registry_quality_freshness_governance.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.registry_quality_freshness_governance
          else
            echo "No Tier 3H.5 Phase 2B registry quality/freshness module found; skipping."
          fi
      - name: Run Tier 3H.5 Phase 2C replay governance
        run: |
          mkdir -p logs

          if [ -f "transmission_layers/asset_discovery/tier3h5/registry_replay_governance.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.registry_replay_governance
          else
            echo "No Tier 3H.5 Phase 2C replay governance module found; skipping."
          fi
      - name: Run Tier 3H.5 Phase 3 sample/CLI (if present)
        run: |
          if [ -f "transmission_layers/asset_discovery/tier3h5/canonical_graph_governance.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.canonical_graph_governance
          elif [ -f "transmission_layers/asset_discovery/tier3h5/canonical_graph_governance_cli.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.canonical_graph_governance_cli
          else
            echo "No Tier 3H.5 Phase 3 sample/CLI module found; skipping."
          fi
      - name: Run Tier 3H.5 Phase 4 sample/CLI (if present)
        run: |
          if [ -f "transmission_layers/asset_discovery/tier3h5/canonical_propagation_memory.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.canonical_propagation_memory
          elif [ -f "transmission_layers/asset_discovery/tier3h5/canonical_propagation_memory_cli.py" ]; then
            python -m transmission_layers.asset_discovery.tier3h5.canonical_propagation_memory_cli
          else
            echo "No Tier 3H.5 Phase 4 sample/CLI module found; skipping."
          fi
      - name: Run Tier 3H.5 tests
        run: |
          python -m pytest -q \
            tests/test_tier3h5_normalization.py \
            tests/test_tier3h5_deterministic_ids.py \
            tests/test_tier3h5_registry_ingestion.py \
            tests/test_tier3h5_registry_resolution.py \
            tests/test_tier3h5_advisory_registry_hooks.py \
            tests/test_tier3h5_advisory_registry_observability.py \
            tests/test_tier3h5_registry_propagation_governance.py \
            tests/test_tier3h5_registry_quality_freshness_governance.py \
            tests/test_tier3h5_registry_replay_governance.py \
            tests/test_tier3h5_canonical_graph_governance.py \
            tests/test_tier3h5_canonical_propagation_memory.py
      - name: Upload observability summary
        uses: actions/upload-artifact@v4
        with:
          name: tier3h5-registry-summary
          path: |
            logs/tier3h5_registry_foundation_summary.json
            logs/tier3h5_registry_resolution_summary.json
            logs/tier3h5_advisory_registry_summary.json
            logs/tier3h5_registry_propagation_governance_summary.json
            logs/tier3h5_canonical_graph_governance_summary.json
            logs/tier3h5_canonical_propagation_memory_summary.json
            # Phase 2A coverage diagnostics are uploaded when optional telemetry modules emit them.
            logs/tier3h5_registry_coverage_summary.json
            logs/tier3h5_normalization_diagnostics.json
            logs/tier3h5_exchange_coverage_breakdown.json
            logs/tier3h5_security_type_coverage_breakdown.json
            logs/tier3h5_phase2a_coverage_summary.json
            logs/tier3h5_advisory_coverage_diagnostics.json
            logs/tier3h5_provenance_diagnostics.json
            logs/tier3h5_registry_freshness_summary.json
            logs/tier3h5_registry_quality_summary.json
            logs/tier3h5_registry_snapshot_lineage.json
            logs/tier3h5_source_precedence_diagnostics.json
            logs/tier3h5_phase2b_quality_freshness_summary.json
            logs/tier3h5_registry_drift_summary.json
            logs/tier3h5_registry_replay_governance_summary.json
            logs/tier3h5_registry_snapshot_comparison.json
            logs/tier3h5_registry_replay_metrics.json
            logs/tier3h5_phase2c_replay_governance_summary.json
            logs/tier3h5_replay_baseline_manifest.json
            logs/tier3h5_replay_history_summary.json
            logs/tier3h5_replay_continuity_lineage.json
            logs/tier3h5_replay_chain_metrics.json
            logs/tier3h5_phase2c1_replay_persistence_summary.json
            logs/tier3h5_registry_replay_baseline_history.json
