name: Phase 3A.2 Cross-Theme Relationship Expansion

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: "Theme name to read from structural_theme_evidence"
        required: true
        default: "ai"
      anchor_theme_name:
        description: "Anchor theme name"
        required: true
        default: "ai"
      max_evidence_rows:
        description: "Max evidence rows to read"
        required: true
        default: "3000"
      min_evidence_score:
        description: "Minimum evidence relevance score, 0-100"
        required: true
        default: "0"

jobs:
  phase3a2-cross-theme-relationship-expansion:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      THEME_NAME: ${{ github.event.inputs.theme_name }}
      ANCHOR_THEME_NAME: ${{ github.event.inputs.anchor_theme_name }}
      MAX_EVIDENCE_ROWS: ${{ github.event.inputs.max_evidence_rows }}
      MIN_EVIDENCE_SCORE: ${{ github.event.inputs.min_evidence_score }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Phase 3A.2 Cross-Theme Relationship Expansion
        working-directory: transmission_layers/graph_foundation
        run: |
          python phase3a2_cross_theme_relationship_expansion.py

      - name: Resolve orchestration context (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          mkdir -p logs
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file logs/execution_context.json

      - name: Tier 3C validation summary (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file logs/execution_context.json \
            --source phase3a2_cross_theme_relationship_expansion \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D telemetry snapshot (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "SUCCESS" \
            --runtime-seconds "0" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Build artifact manifest (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          if [[ -f logs/execution_context.json ]]; then
            python -m core.orchestration_guardrails.cli artifact manifest \
              --context-file logs/execution_context.json \
              --validation-summary-file logs/validation_summary.json \
              --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
              --output-file logs/context_artifact_manifest.json
          else
            echo "Skipping artifact manifest: logs/execution_context.json not found"
          fi

      - name: Tier 3E operational aggregation (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          if [[ -f logs/execution_context.json ]]; then
            python -m core.orchestration_guardrails.cli aggregate operational-summary \
              --context-file logs/execution_context.json \
              --validation-summary-file logs/validation_summary.json \
              --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
              --artifact-manifest-file logs/context_artifact_manifest.json \
              --output-dir logs
          else
            echo "Skipping Tier 3E aggregation: logs/execution_context.json not found"
          fi

      - name: Tier 3F operational trend intelligence (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          if [[ -f logs/execution_context.json ]]; then
            python -m core.orchestration_guardrails.cli trend analyze
          else
            echo "Skipping Tier 3F trend analysis: logs/execution_context.json not found"
          fi

      - name: Upload observability artifacts (advisory)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase3a2-cross-theme-relationship-expansion-observability
          if-no-files-found: warn
          path: |
            transmission_layers/graph_foundation/logs/execution_context.json
            transmission_layers/graph_foundation/logs/platform_validation_summary.json
            transmission_layers/graph_foundation/logs/platform_runtime_summary.json
            transmission_layers/graph_foundation/logs/platform_pipeline_index.json
            transmission_layers/graph_foundation/logs/platform_operational_summary.json
            transmission_layers/graph_foundation/logs/platform_execution_consistency.json
            transmission_layers/graph_foundation/logs/platform_operational_trend_summary.json
            transmission_layers/graph_foundation/logs/platform_recurring_warnings.json
            transmission_layers/graph_foundation/logs/platform_runtime_drift_summary.json
            transmission_layers/graph_foundation/logs/platform_workflow_health_score.json
            transmission_layers/graph_foundation/logs/context_artifact_manifest.json
