name: AI Transmission Phase 2A Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"   # 7:00 AM Singapore time, Mon-Fri

jobs:
  ai-transmission-phase2a:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      THEME_NAME: ai
      PIPELINE_NAME: AI_TRANSMISSION_PHASE2A
      STRUCTURAL_THEME_NAME: ai
      THEME_VERSION: v1
      PATCH_STRUCTURAL_THEME_SCORES: "true"
      PHASE2D_LOOKBACK_DAYS: "90"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-dateutil

      - name: Run AI transmission evidence ingestion
        run: |
          python ai_transmission/ai_transmission_evidence_ingestion_v1.py

      - name: Run AI transmission scoring engine
        run: |
          python ai_transmission/ai_transmission_scoring_v2_phase1_refactor_built.py

      - name: Run Phase 2A validation and telemetry
        run: |
          python ai_transmission/phase2a_validation_telemetry.py

      - name: Run Phase 2B explainability layer
        run: |
          if [ -f "transmission_layers/ai_transmission/phase2b_explainability_layer.py" ]; then
            python transmission_layers/ai_transmission/phase2b_explainability_layer.py
          elif [ -f "ai_transmission/phase2b_explainability_layer.py" ]; then
            python ai_transmission/phase2b_explainability_layer.py
          else
            echo "phase2b_explainability_layer.py not found in expected locations."
            exit 1
          fi

      - name: Run Phase 2D historical propagation analytics
        run: |
          if [ -f "transmission_layers/shared/structural_theme_historical_analytics_phase2d.py" ]; then
            python transmission_layers/shared/structural_theme_historical_analytics_phase2d.py
          elif [ -f "ai_transmission/structural_theme_historical_analytics_phase2d.py" ]; then
            python ai_transmission/structural_theme_historical_analytics_phase2d.py
          else
            echo "structural_theme_historical_analytics_phase2d.py not found in expected locations."
            exit 1
          fi

      - name: Archive production reports
        if: always()
        run: |
          if [ -f "archive_production_reports.py" ]; then
            python archive_production_reports.py
          else
            echo "archive_production_reports.py not found. Skipping archival."
          fi

      - name: Notify archival failure
        if: failure()
        run: |
          if [ -f "notify_archival_failure.py" ]; then
            python notify_archival_failure.py
          else
            echo "notify_archival_failure.py not found. Skipping archival failure notification."
          fi

      - name: Ensure logs directory exists (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          mkdir -p logs

      - name: Resolve orchestration context (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --output-file logs/execution_context.json

      - name: Tier 3C validation summary (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file logs/execution_context.json \
            --source ai_transmission_phase2a_pipeline_phase2d_revised \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D telemetry snapshot (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "SUCCESS" \
            --runtime-seconds "0" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Build artifact manifest (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json

      - name: Tier 3E cross-workflow operational aggregation (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file logs/execution_context.json \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Tier 3F operational trend intelligence (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd transmission_layers/graph_foundation
          python -m core.orchestration_guardrails.cli trend analyze \
            --logs-dir logs \
            --analysis-window-days 14


      - name: Tier 3G historical operational intelligence persistence (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_DATE_SGT: ${{ env.RUN_DATE_SGT }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p logs
          if [ -f "transmission_layers/graph_foundation/logs/execution_context.json" ]; then
            cp transmission_layers/graph_foundation/logs/execution_context.json logs/execution_context.json
          fi
          python scripts/write_observability_history.py

      - name: Upload observability artifacts (advisory)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-transmission-phase2a-phase2d-revised-observability
          if-no-files-found: warn
          path: |
            transmission_layers/graph_foundation/logs/execution_context.json
            transmission_layers/graph_foundation/logs/platform_validation_summary.json
            transmission_layers/graph_foundation/logs/platform_runtime_summary.json
            transmission_layers/graph_foundation/logs/platform_pipeline_index.json
            transmission_layers/graph_foundation/logs/platform_operational_summary.json
            transmission_layers/graph_foundation/logs/platform_execution_consistency.json
            transmission_layers/graph_foundation/logs/platform_operational_trend_summary.json
            transmission_layers/graph_foundation/logs/platform_recurring_warnings.json
            transmission_layers/graph_foundation/logs/platform_runtime_drift_summary.json
            transmission_layers/graph_foundation/logs/platform_workflow_health_score.json
            transmission_layers/graph_foundation/logs/context_artifact_manifest.json
