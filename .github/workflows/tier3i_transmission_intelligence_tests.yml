name: tier3i_transmission_intelligence_tests

on:
  pull_request:
    paths:
      - 'transmission_layers/**'
      - 'tests/test_tier3i_*'
      - 'tests/test_tier3h5_*'
      - '.github/workflows/tier3i_transmission_intelligence_tests.yml'
  workflow_dispatch:

jobs:
  run-tier3i-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Run Tier 3I intelligence tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_tier3i_edge_quality.py \
            tests/test_tier3i_structural_influence.py \
            tests/test_tier3i_intelligence_summary.py \
            tests/test_tier3i_multi_hop_quality.py \
            tests/test_tier3i_path_explainability.py \
            tests/test_tier3i_regime_drift.py \
            tests/test_tier3i_contagion_mapping.py


      - name: Generate Tier 3I intelligence JSON artifacts
        run: |
          mkdir -p logs
          PYTHONPATH=. python -m transmission_layers.intelligence.tier3i.intelligence_summary
          PYTHONPATH=. python -m transmission_layers.intelligence.tier3i.multi_hop_quality
          PYTHONPATH=. python -m transmission_layers.intelligence.tier3i.path_explainability
          PYTHONPATH=. python -m transmission_layers.intelligence.tier3i.structural_regime
          PYTHONPATH=. python -m transmission_layers.intelligence.tier3i.regime_drift
          PYTHONPATH=. python -m transmission_layers.intelligence.tier3i.contagion_mapping

      - name: Upload Tier 3I intelligence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier3i-intelligence-artifacts
          path: |
            logs/*.json
            logs/tier3i_contagion_mapping_summary.json
          if-no-files-found: warn

      - name: Run Tier 3H.5 regression tests (optional)
        run: |
          if [ -f tests/test_tier3h5_registry_resolution.py ]; then
            PYTHONPATH=. python -m pytest -q tests/test_tier3h5_registry_resolution.py
          else
            echo "Tier 3H.5 regression tests not present; skipping."
          fi
