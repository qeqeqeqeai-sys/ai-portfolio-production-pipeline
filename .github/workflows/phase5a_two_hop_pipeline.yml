name: Phase 5A Controlled Two-Hop Propagation

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: Theme name
        required: true
        default: ai
      run_date_sgt:
        description: Run date in Singapore time, YYYY-MM-DD. Leave blank for today.
        required: false
        default: ""
      top_k_neighbors:
        description: Max outgoing neighbors per node
        required: true
        default: "10"
      min_edge_confidence:
        description: Minimum edge confidence
        required: true
        default: "0.20"
      min_edge_transmission_potential:
        description: Minimum edge transmission potential
        required: true
        default: "0.00"
      hop_attenuation_factor:
        description: Two-hop attenuation factor
        required: true
        default: "0.85"

  schedule:
    - cron: "30 23 * * *" # 07:30 SGT daily

jobs:
  phase5a-two-hop-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      THEME_NAME: ${{ github.event.inputs.theme_name || 'ai' }}
      RUN_DATE_SGT: ${{ github.event.inputs.run_date_sgt }}
      TOP_K_NEIGHBORS: ${{ github.event.inputs.top_k_neighbors || '10' }}
      MIN_EDGE_CONFIDENCE: ${{ github.event.inputs.min_edge_confidence || '0.20' }}
      MIN_EDGE_TRANSMISSION_POTENTIAL: ${{ github.event.inputs.min_edge_transmission_potential || '0.00' }}
      HOP_ATTENUATION_FACTOR: ${{ github.event.inputs.hop_attenuation_factor || '0.85' }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      EXECUTION_CONTEXT_FILE: logs/execution_context.json
      PHASE5A_GENERATION_RAW_JSON: logs/phase5a_two_hop_generation.json
      PHASE5A_GENERATION_CONTEXT_JSON: logs/phase5a_two_hop_generation_context.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create runtime folders
        run: |
          mkdir -p logs outputs

      - name: Capture pipeline start timestamp
        shell: bash
        run: |
          echo "PIPELINE_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Tier 3C — Shared execution context resolution
      # ------------------------------------------------------------------
      - name: Tier 3C resolve shared execution context
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context resolve \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-mode "${{ github.event_name }}" \
            --theme-name "${THEME_NAME:-ai}" \
            --requested-run-date-sgt "${RUN_DATE_SGT:-}" \
            --output-file "${EXECUTION_CONTEXT_FILE}"

      - name: Tier 3C export initial execution context to GitHub env
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context export-github-env \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --github-env-file "${GITHUB_ENV}"

      # ------------------------------------------------------------------
      # Tier 3B — Advisory-only orchestration preflight
      # ------------------------------------------------------------------
      - name: Tier 3B preflight orchestration guardrails
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDRAILS_STRICT_MODE: "false"
          GUARDRAILS_EXPECTED_WORKFLOW_ROLE: "phase5a_two_hop"
        run: |
          python -m core.orchestration_guardrails.cli preflight \
            --workflow-name "${{ github.workflow }}"

      - name: Phase 5A — Generate and score controlled two-hop paths
        run: |
          python transmission_layers/phase5a_two_hop/phase5a_two_hop_propagation.py | tee "${PHASE5A_GENERATION_RAW_JSON}"

      - name: Tier 3C normalize Phase 5A generation JSON for context update
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw_path = Path("logs/phase5a_two_hop_generation.json")
          context_path = Path("logs/phase5a_two_hop_generation_context.json")

          raw = raw_path.read_text(encoding="utf-8").strip()
          start = raw.find("{")
          end = raw.rfind("}")

          if start == -1 or end == -1 or end <= start:
              raise SystemExit("Could not parse Phase 5A generation JSON output.")

          data = json.loads(raw[start:end + 1])

          run_date = data.get("run_date_sgt")
          if not run_date:
              raise SystemExit("Phase 5A generation output did not include run_date_sgt.")

          context_path.parent.mkdir(parents=True, exist_ok=True)
          context_path.write_text(
              json.dumps({"run_date_sgt": run_date}, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          print(f"Normalized Phase 5A generation run_date_sgt={run_date}")
          print(f"Wrote context update JSON to {context_path}")
          PY

      - name: Tier 3C update execution context from generation output
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context update-from-json \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source-json "${PHASE5A_GENERATION_CONTEXT_JSON}" \
            --field run_date_sgt \
            --target-field resolved_run_date_sgt

      - name: Tier 3C export final execution context to GitHub env
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli context export-github-env \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --github-env-file "${GITHUB_ENV}"

      - name: Phase 5A — Validation hooks
        run: |
          echo "Validating Phase 5A outputs for RUN_DATE_SGT=${RUN_DATE_SGT}"
          python transmission_layers/phase5a_two_hop/phase5a_validate_two_hop.py

      - name: Mark Phase 5A pipeline status success
        shell: bash
        run: |
          echo "PIPELINE_STATUS=SUCCESS" >> "$GITHUB_ENV"

      - name: Capture Phase 5A runtime seconds
        shell: bash
        run: |
          PIPELINE_END_TS=$(date +%s)
          RUNTIME_SECONDS=$((PIPELINE_END_TS - PIPELINE_START_TS))
          echo "PHASE5A_RUNTIME_SECONDS=${RUNTIME_SECONDS}" >> "$GITHUB_ENV"
          echo "Phase 5A runtime seconds: ${RUNTIME_SECONDS}"

      # ------------------------------------------------------------------
      # Tier 3D — Context-aware validation, telemetry, and artifacts
      # ------------------------------------------------------------------
      - name: Tier 3D generate validation summary
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli validation summarize \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --source phase5a_validation_hooks \
            --validation-status passed \
            --warnings-count 0 \
            --errors-count 0 \
            --hard-fail-count 0 \
            --output-file logs/validation_summary.json

      - name: Tier 3D generate telemetry context snapshot
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli telemetry snapshot \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --pipeline-status "${PIPELINE_STATUS:-SUCCESS}" \
            --runtime-seconds "${PHASE5A_RUNTIME_SECONDS:-0}" \
            --output-file logs/telemetry_context_snapshot.json

      - name: Tier 3D generate context artifact manifest
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli artifact manifest \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --output-file logs/context_artifact_manifest.json


      - name: Tier 3D.1 advisory consistency checks
        shell: bash
        continue-on-error: true
        run: |
          python -m core.orchestration_guardrails.cli validation check-env-consistency \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json


      - name: Tier 3E cross-workflow operational aggregation
        shell: bash
        run: |
          python -m core.orchestration_guardrails.cli aggregate operational-summary \
            --context-file "${EXECUTION_CONTEXT_FILE}" \
            --validation-summary-file logs/validation_summary.json \
            --telemetry-snapshot-file logs/telemetry_context_snapshot.json \
            --artifact-manifest-file logs/context_artifact_manifest.json \
            --output-dir logs

      - name: Upload Phase 5A execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5a-two-hop-execution-logs
          path: |
            logs/execution_context.json
            logs/phase5a_two_hop_generation.json
            logs/phase5a_two_hop_generation_context.json
            logs/validation_summary.json
            logs/telemetry_context_snapshot.json
            logs/context_artifact_manifest.json
            logs/platform_pipeline_index.json
            logs/platform_runtime_summary.json
            logs/platform_validation_summary.json
            logs/platform_operational_summary.json
