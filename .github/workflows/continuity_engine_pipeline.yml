name: Continuity Engine Pipeline

on:
  workflow_dispatch:

jobs:
  continuity-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Continuity Engine
        run: |
          python transmission_layers/graph_foundation/continuity/continuity_engine.py
