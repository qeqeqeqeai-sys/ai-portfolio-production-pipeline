name: SEFI Universe Source Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check SEFI universe source
        run: |
          python scripts/check_sefi_universe_source.py

      - name: Validate DB universe
        run: |
          python scripts/validate_sefi_observation_universe.py --source db
