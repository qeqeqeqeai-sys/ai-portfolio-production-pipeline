# Tier 3B reusable snippet — lineage completion step
#
# Use only after the CLI supports `finish`.
# Completion steps must use `if: always()` so failures are recorded.
# Keep disabled/commented until implemented.

- name: Tier 3B lineage finish
  if: ${{ false }}
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  run: |
    python -m core.orchestration_guardrails.cli finish \
      --workflow-name "${{ github.workflow }}" \
      --run-id "${{ github.run_id }}" \
      --status "${{ job.status }}"
